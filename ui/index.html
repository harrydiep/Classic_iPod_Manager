function renderSidebar(){
  const sb = $("#sidebar");
  let h = `<div class="shead">Devices</div>`;
  if (!S.devices.length) h += `<div class="sitem" style="color:var(--muted)"><span class="lbl">None connected</span></div>`;
  for (const d of S.devices){
    const open = S.lib && S.lib.device.root === d.root;
    const sel = open ? S.view === "summary" : S.view === "setup" && S.setupRoot === d.root;
    h += `<div class="sitem ${sel ? "sel" : ""}" data-dev="${esc(d.root)}" title="${esc(d.model.name)} — ${esc(d.root)}">
      <svg><use href="#i-player"/></svg>
      ${open && S.renaming ? `<input id="renameIn" value="${esc(S.lib.device.name)}" aria-label="iPod name">` : `<span class="lbl">${esc(open ? S.lib.device.name : d.name)}</span>`}
      <button class="eject" data-eject="${esc(d.root)}" title="Eject" aria-label="Eject ${esc(d.name)}"><svg width="12" height="12"><use href="#i-eject"/></svg></button></div>`;
    if (open){
      const n = libCounts();
      h += `<div class="sitem child ${S.view === "music" ? "sel" : ""}" data-view="music"><svg><use href="#i-note"/></svg><span class="lbl">Music</span><span class="cnt">${n.songs.toLocaleString()}</span></div>`;
      // iPods without video (before the 5th generation, minis, early nanos, shuffles) have no Videos section
      if (S.lib.device.model.video || n.videos){
      h += `<div class="sitem child ${S.view === "videos" ? "sel" : ""}" data-view="videos"><svg><use href="#i-video"/></svg><span class="lbl">Videos</span><span class="cnt">${n.videos ? n.videos.toLocaleString() : ""}</span></div>`;
      for (const [mt, label] of VIDEO_KINDS){
        const c = S.lib.tracks.filter(t => t.video && (t.mediaType & mt)).length;
        h += `<div class="sitem child2 ${S.view === "v:" + mt ? "sel" : ""}" data-view="v:${mt}" data-vkind="${mt}" title="Videos added here are filed under ${label} on the iPod"><span class="lbl">${label}</span><span class="cnt">${c ? c.toLocaleString() : ""}</span></div>`;
      }
      }
    }
  }
  if (S.lib){
    const ro = !!S.lib.readOnly;
    h += `<div class="shead plhead" data-plhead="1"><span>Playlists</span>${ro ? "" : `<button class="addpl" id="newPl" title="New Playlist (Ctrl+N)" aria-label="New Playlist">+</button>`}</div>`;
    for (const p of S.lib.playlists){
      const kind = p.smart ? "Smart playlist – fills itself" : p.podcast ? "Podcasts" : "Playlist";
      h += `<div class="sitem ${S.view === "pl:" + p.id ? "sel" : ""}" data-view="pl:${esc(p.id)}" data-pl="${esc(p.id)}" ${p.editable ? 'data-editable="1"' : ""} title="${esc(p.name)} · ${kind}">
        <svg><use href="#${p.smart ? "i-gear" : "i-list"}"/></svg>${S.renamingPl === p.id ? `<input id="plRenameIn" value="${esc(p.name)}" aria-label="Playlist name">` : `<span class="lbl">${esc(p.name)}</span>`}<span class="cnt">${p.trackIds.length.toLocaleString()}</span></div>`;
    }
    if (!S.lib.playlists.length && !ro) h += `<div class="sitem hint" data-newpl="1">Drag songs here for a new playlist</div>`;
  }
  h += `<div class="shead">Tools</div><div class="sitem ${S.view === "fm" ? "sel" : ""}" data-view="fm" title="Edit details and artwork, and convert between formats (Ctrl+M)"><svg><use href="#i-convert"/></svg><span class="lbl">Format Manager</span>${FM.items.length ? `<span class="cnt">${FM.items.length.toLocaleString()}</span>` : ""}</div>`;
  sb.innerHTML = h;
  const pi = $("#plRenameIn");
  if (pi){ pi.focus(); pi.select();
    pi.onkeydown = e => { if (e.key === "Enter") finishPlRename(pi.value); if (e.key === "Escape"){ S.renamingPl = null; renderSidebar(); } e.stopPropagation(); };
    pi.onblur = () => finishPlRename(pi.value);
    pi.onmousedown = pi.onclick = pi.ondblclick = e => e.stopPropagation();
  }
  const np = $("#newPl");
  if (np) np.onclick = e => { e.stopPropagation(); newPlaylist(); };
  const ri = $("#renameIn");
  if (ri){ ri.focus(); ri.select();
    ri.onkeydown = e => { if (e.key === "Enter") finishRename(ri.value); if (e.key === "Escape"){ S.renaming = false; renderSidebar(); } e.stopPropagation(); };
    ri.onblur = () => finishRename(ri.value);
  }
}
async function finishRename(v){
  if (!S.renaming) return;
  S.renaming = false;
  v = v.trim();
  if (v && S.lib && v !== S.lib.device.name){
    try { await api("rename", v); S.lib.device.name = v; flash("Renamed", v); } catch(e){ alertSheet("Couldn’t rename the iPod", e.message); }
  }
  renderAll();
}
$("#sidebar").addEventListener("click", e => {
  const ej = e.target.closest("[data-eject]");
  if (ej){ e.stopPropagation(); eject(ej.dataset.eject); return; }
  const it = e.target.closest(".sitem");
  if (!it || S.renaming) return;
  if (it.dataset.dev){
    const root = it.dataset.dev;
    if (S.lib && S.lib.device.root === root){ setView("summary"); }
    else openDevice(root);
  } else if (it.dataset.view){ setView(it.dataset.view); }
});
$("#sidebar").addEventListener("dblclick", e => {
  const pl = e.target.closest(".sitem[data-pl]");
  if (pl && S.lib && !S.lib.readOnly){ S.renamingPl = pl.dataset.pl; renderSidebar(); return; }
  const it = e.target.closest(".sitem[data-dev]");
  if (it && S.lib && S.lib.device.root === it.dataset.dev && !S.lib.readOnly){ S.renaming = true; renderSidebar(); }
});
$("#sidebar").addEventListener("contextmenu", e => {
  if (!S.lib || S.lib.readOnly) return;
  const pl = e.target.closest(".sitem[data-pl]");
  if (pl){
    e.preventDefault();
    const p = S.lib.playlists.find(x => x.id === pl.dataset.pl); if (!p) return;
    popMenu(e.clientX, e.clientY, [
      {label: "Play", fn: () => { setView("pl:" + p.id); playList(S.list, 0); }, disabled: !p.trackIds.length},
      {label: "Rename", fn: () => { S.renamingPl = p.id; renderSidebar(); }},
      {label: "Delete Playlist…", fn: () => deletePlaylist(p)},
      null,
      {label: "New Playlist", fn: () => newPlaylist()},
    ]);
    return;
  }
  if (e.target.closest(".plhead, [data-newpl]")){ e.preventDefault(); popMenu(e.clientX, e.clientY, [{label: "New Playlist", fn: () => newPlaylist()}]); }
});

/* ------------------------------------------------------------------ playlists */
function playlistById(id){ return S.lib ? S.lib.playlists.find(p => p.id === id) : null; }
async function newPlaylist(ids, name){
  if (!S.lib || S.lib.readOnly) return;
  try {
    const id = await api("createPlaylist", name || "untitled playlist", ids || []);
    await reload();
    S.view = "pl:" + id; S.sel.clear(); S.listDirty = true;
    if (!name) S.renamingPl = id;
    renderAll();
    if (ids && ids.length) flash("New playlist", plural(ids.length, "song"));
  } catch(e){ alertSheet("Couldn’t make the playlist", e.message); }
}
async function finishPlRename(v){
  const id = S.renamingPl; if (!id) return;
  S.renamingPl = null;
  const p = playlistById(id);
  v = v.trim();
  if (p && v && v !== p.name){
    try { await api("renamePlaylist", id, v); await reload(); return; } catch(e){ alertSheet("Couldn’t rename the playlist", e.message); }
  }
  renderSidebar();
}
function deletePlaylist(p){
  sheet(`<div class="sheet-h">Delete the playlist “${esc(p.name)}”?</div><div class="sheet-b"><p>Its ${plural(p.trackIds.length, "song")} stay on the iPod; only the playlist goes.</p></div>
    <div class="sheet-f"><button class="btn" data-c>Cancel</button><button class="btn danger" data-ok>Delete Playlist</button></div>`,
    (v, close) => { v.querySelector("[data-c]").onclick = close;
      v.querySelector("[data-ok]").onclick = async () => {
        close();
        try { await api("deletePlaylist", p.id); if (S.view === "pl:" + p.id) S.view = "music"; await reload(); flash("Playlist deleted", p.name); }
        catch(e){ alertSheet("Couldn’t delete the playlist", e.message); }
      }; });
}
async function addToPlaylist(id, ids){
  const p = playlistById(id); if (!p || !ids.length) return;
  try {
    const n = await api("addToPlaylist", id, ids);
    await reload();
    flash(n ? `Added ${plural(n, "song")}` : "Already in the playlist", `to “${p.name}”`);
  } catch(e){ alertSheet("Couldn’t add to the playlist", e.message); }
}
async function removeFromPlaylist(){
  const p = curPlaylist(); if (!p || !p.editable || !S.sel.size) return;
  const pos = []; p.trackIds.forEach((id, i) => { if (S.sel.has(id)) pos.push(i); });
  try { await api("removeFromPlaylist", p.id, pos); S.sel.clear(); await reload(); flash(`Removed ${plural(pos.length, "song")}`, `from “${p.name}”`); }
  catch(e){ alertSheet("Couldn’t change the playlist", e.message); }
}
function canReorder(){
  const p = curPlaylist(), srt = curSort();
  return !!(p && p.editable && srt.key === "playlist" && srt.dir > 0 && !S.search && !S.browser && S.lib && !S.lib.readOnly);
}
async function movePlaylistItems(to){
  const p = curPlaylist(); if (!p) return;
  const pos = []; p.trackIds.forEach((id, i) => { if (S.sel.has(id)) pos.push(i); });
  try { await api("movePlaylistItems", p.id, pos, to); await reload(); } catch(e){ alertSheet("Couldn’t reorder the playlist", e.message); }
}
async function setVideoKind(ids, mt){
  const label = (VIDEO_KINDS.find(k => k[0] === mt) || [0, ""])[1];
  try { await api("update", ids, {mediaType: mt}, false); pendingAfterJob = () => flash(`Moved ${plural(ids.length, "video")}`, `to ${label}`); }
  catch(e){ alertSheet("Couldn’t move the videos", e.message); }
}

/* ------------------------------------------------------------------ adding iPod songs to a playlist */
// Add Songs in a playlist opens a list of everything on the iPod to pick
// from: click songs to tick them (Shift+click ticks a run), search to narrow
// the list, then Add to Playlist. Songs already in the playlist are marked.
function openPlaylistPicker(){
  const pl = curPlaylist();
  if (!pl || !pl.editable || !canWrite()) return;
  const inPl = new Set(pl.trackIds);
  const hasVideos = S.lib.tracks.some(t => t.video);
  const K = {kind: "music", q: "", sort: {key: "artist", dir: 1}, sel: new Set(), list: [], cur: -1, anchor: -1};
  const cols = [["title", "Name"], ["artist", "Artist"], ["album", "Album"], ["lengthMs", "Time", true]];
  sheet(`<div class="sheet-h">Add Songs to “${esc(pl.name)}”</div>
    <div class="pk-bar">
      <label class="search pk-search"><svg><use href="#i-search"/></svg><input id="pkSearch" type="text" placeholder="Search songs on the iPod" aria-label="Search songs on the iPod" spellcheck="false" autofocus data-escclear><button class="clear" id="pkClear" aria-label="Clear search">✕</button></label>
      ${hasVideos ? `<div class="seg" role="group" aria-label="Show"><button data-kind="music" class="on">Songs</button><button data-kind="video">Videos</button></div>` : ""}
      <span class="pk-count" id="pkCount" aria-live="polite"></span>
    </div>
    <div class="pk-list">
      <div class="pk-head" id="pkHead"></div>
      <div class="pk-scroll" id="pkScroll" tabindex="0" role="listbox" aria-multiselectable="true" aria-label="Songs on the iPod"><div class="pk-spacer" id="pkSpacer"></div></div>
      <div class="pk-empty hidden" id="pkEmpty"></div>
    </div>
    <div class="sheet-f"><div class="left"><button class="btn" data-clear disabled>Clear Selection</button></div>
      <button class="btn" data-c>Cancel</button><button class="btn primary" data-ok disabled>Add to Playlist</button></div>`,
  (v, close) => {
    v.querySelector(".sheet").classList.add("picker");
    const sc = v.querySelector("#pkScroll"), sp = v.querySelector("#pkSpacer"), q = v.querySelector("#pkSearch");
    const selectable = t => !inPl.has(t.id);
    const build = () => {
      const words = K.q.toLowerCase().split(/\s+/).filter(Boolean);
      let list = S.lib.tracks.filter(t => (K.kind === "video") === !!t.video);
      if (words.length) list = list.filter(t => {
        const hay = [t.title, t.artist, t.albumArtist, t.album, t.genre, t.composer].join(" ").toLowerCase();
        return words.every(w => hay.includes(w));
      });
      const c = cmpBy(K.sort.key);
      K.list = list.sort((a, b) => c(a, b) * K.sort.dir);
      K.cur = Math.min(K.cur, K.list.length - 1);
    };
    const paintHead = () => {
      const avail = K.list.filter(selectable), all = avail.length > 0 && avail.every(t => K.sel.has(t.id));
      v.querySelector("#pkHead").innerHTML = `<span><input type="checkbox" id="pkAll" ${all ? "checked" : ""} ${avail.length ? "" : "disabled"} aria-label="Tick every song shown" title="Tick every song shown (Ctrl+A)"></span>` +
        cols.map(([k, l, r]) => `<span data-sort="${k}" class="${r ? "r" : ""}" role="button" title="Sort by ${l}">${l}${K.sort.key === k ? `<span class="arrow">${K.sort.dir > 0 ? "▲" : "▼"}</span>` : ""}</span>`).join("");
      const box = v.querySelector("#pkAll");
      if (box && !all && avail.some(t => K.sel.has(t.id))) box.indeterminate = true;
    };
    const paintFoot = () => {
      const n = K.sel.size;
      v.querySelector("[data-ok]").disabled = !n;
      v.querySelector("[data-ok]").textContent = n ? `Add ${plural(n, K.kind === "video" && [...K.sel].every(id => (S.byId.get(id) || {}).video) ? "Video" : "Song")} to Playlist` : "Add to Playlist";
      v.querySelector("[data-clear]").disabled = !n;
      v.querySelector("#pkCount").textContent = `${plural(K.list.length, K.kind === "video" ? "video" : "song")}${n ? ` · ${n.toLocaleString()} ticked` : ""}`;
    };
    let lastKey = "";
    const paintRows = force => {
      sp.style.height = K.list.length * ROW + "px";
      const first = Math.max(0, Math.floor(sc.scrollTop / ROW) - 5), last = Math.min(K.list.length, Math.ceil((sc.scrollTop + sc.clientHeight) / ROW) + 5);
      const key = first + ":" + last;
      if (!force && key === lastKey) return;
      lastKey = key;
      let h = "";
      for (let i = first; i < last; i++){
        const t = K.list[i], has = inPl.has(t.id), on = K.sel.has(t.id);
        h += `<div class="pk-row ${i % 2 ? "odd" : ""} ${on ? "on" : ""} ${has ? "has" : ""} ${i === K.cur ? "cur" : ""}" style="top:${i*ROW}px" data-i="${i}" role="option" aria-selected="${on}" ${has ? `aria-disabled="true" title="Already in this playlist"` : ""}>
          <span><input type="checkbox" tabindex="-1" ${on || has ? "checked" : ""} ${has ? "disabled" : ""} aria-hidden="true"></span>
          <span>${esc(t.title || "")}${has ? `<span class="tag">In playlist</span>` : ""}</span><span class="m">${esc(t.artist || "")}</span><span class="m">${esc(t.album || "")}</span><span class="r m">${fmtTime(t.lengthMs)}</span></div>`;
      }
      sp.innerHTML = h;
      const em = v.querySelector("#pkEmpty");
      em.classList.toggle("hidden", K.list.length > 0);
      em.innerHTML = K.q ? `<div><b>Nothing matches “${esc(K.q)}”</b><br>Try fewer words.</div>` : `<div>No ${K.kind === "video" ? "videos" : "songs"} on this iPod yet.</div>`;
    };
    const refresh = () => { build(); paintHead(); paintRows(true); paintFoot(); };
    const toggle = (i, on) => {
      const t = K.list[i]; if (!t || !selectable(t)) return;
      if (on === undefined) on = !K.sel.has(t.id);
      on ? K.sel.add(t.id) : K.sel.delete(t.id);
    };
    const moveCur = i => {
      K.cur = Math.max(0, Math.min(K.list.length - 1, i));
      const top = K.cur * ROW;
      if (top < sc.scrollTop) sc.scrollTop = top; else if (top + ROW > sc.scrollTop + sc.clientHeight) sc.scrollTop = top + ROW - sc.clientHeight;
      paintRows(true);
    };
    const add = async () => {
      if (!K.sel.size) return;
      // in the order they're listed (by artist and album unless sorted otherwise)
      const order = new Map(); S.lib.tracks.slice().sort((a, b) => cmpBy(K.sort.key)(a, b) * K.sort.dir).forEach((t, i) => order.set(t.id, i));
      const ids = [...K.sel].sort((a, b) => order.get(a) - order.get(b));
      close();
      await addToPlaylist(pl.id, ids);
    };
    sc.addEventListener("scroll", () => paintRows(false));
    sc.addEventListener("mousedown", e => {
      const row = e.target.closest(".pk-row"); if (!row) return;
      e.preventDefault(); sc.focus();
      const i = +row.dataset.i;
      if (e.shiftKey && K.anchor >= 0){
        const on = !K.sel.has((K.list[i] || {}).id);
        const [lo, hi] = K.anchor < i ? [K.anchor, i] : [i, K.anchor];
        for (let j = lo; j <= hi; j++) toggle(j, on);
      } else toggle(i);
      K.anchor = i; K.cur = i;
      paintRows(true); paintHead(); paintFoot();
    });
    sc.addEventListener("dblclick", e => { const row = e.target.closest(".pk-row"); if (row && K.sel.size) add(); });
    sc.addEventListener("keydown", e => {
      if (e.key === "ArrowDown"){ e.preventDefault(); moveCur(K.cur + 1); if (e.shiftKey){ toggle(K.cur, true); paintHead(); paintFoot(); paintRows(true); } }
      else if (e.key === "ArrowUp"){ e.preventDefault(); if (K.cur <= 0){ q.focus(); return; } moveCur(K.cur - 1); if (e.shiftKey){ toggle(K.cur, true); paintHead(); paintFoot(); paintRows(true); } }
      else if (e.key === "PageDown" || e.key === "PageUp"){ e.preventDefault(); const pg = Math.max(1, Math.floor(sc.clientHeight / ROW) - 1); moveCur(K.cur + (e.key === "PageDown" ? pg : -pg)); }
      else if (e.key === "Home" || e.key === "End"){ e.preventDefault(); moveCur(e.key === "Home" ? 0 : K.list.length - 1); }
      else if (e.key === " "){ e.preventDefault(); if (K.cur >= 0){ toggle(K.cur); K.anchor = K.cur; paintRows(true); paintHead(); paintFoot(); } }
      else if (e.key === "Enter"){ e.preventDefault(); if (!K.sel.size && K.cur >= 0) toggle(K.cur); add(); }
      else if (e.ctrlKey && e.key.toLowerCase() === "a"){ e.preventDefault(); selectShown(); }
      else if (e.key.length === 1 && !e.ctrlKey && !e.altKey){ q.focus(); } // typing goes to the search
    });
    const selectShown = () => {
      const avail = K.list.filter(selectable), all = avail.length && avail.every(t => K.sel.has(t.id));
      avail.forEach(t => all ? K.sel.delete(t.id) : K.sel.add(t.id));
      paintRows(true); paintHead(); paintFoot();
    };
    v.querySelector("#pkHead").addEventListener("click", e => {
      if (e.target.id === "pkAll"){ e.preventDefault(); selectShown(); return; }
      const h = e.target.closest("[data-sort]"); if (!h) return;
      const k = h.dataset.sort;
      K.sort = K.sort.key === k ? {key: k, dir: -K.sort.dir} : {key: k, dir: 1};
      refresh();
    });
    let qt;
    q.addEventListener("input", () => {
      v.querySelector(".pk-search").classList.toggle("has", !!q.value);
      clearTimeout(qt); qt = setTimeout(() => { K.q = q.value.trim(); K.cur = K.list.length ? 0 : -1; sc.scrollTop = 0; refresh(); K.cur = K.list.length ? 0 : -1; paintRows(true); }, 120);
    });
    q.addEventListener("keydown", e => {
      if (e.key === "ArrowDown"){ e.preventDefault(); sc.focus(); if (K.cur < 0) moveCur(0); }
      else if (e.key === "Enter"){
        e.preventDefault();
        // Enter in the search ticks the only match (search, Enter, search,
        // Enter… builds up a selection); otherwise, or with Ctrl, it adds
        const avail = K.list.filter(selectable);
        if (!e.ctrlKey && avail.length === 1 && !K.sel.has(avail[0].id)){
          toggle(K.list.indexOf(avail[0]), true); paintRows(true); paintHead(); paintFoot();
          q.select(); return;
        }
        add();
      }
      else if (e.key === "Escape" && q.value){ e.preventDefault(); e.stopPropagation(); q.value = ""; q.dispatchEvent(new Event("input")); }
    });
    v.querySelector("#pkClear").onclick = e => { e.preventDefault(); q.value = ""; q.dispatchEvent(new Event("input")); q.focus(); };
    v.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => {
      K.kind = b.dataset.kind; K.cur = -1; K.anchor = -1; sc.scrollTop = 0;
      v.querySelectorAll("[data-kind]").forEach(x => x.classList.toggle("on", x === b));
      refresh();
    });
    v.querySelector("[data-clear]").onclick = () => { K.sel.clear(); paintRows(true); paintHead(); paintFoot(); };
    v.querySelector("[data-c]").onclick = close;
    v.querySelector("[data-ok]").onclick = add;
    refresh();
    // rows are drawn once the sheet has its size
    requestAnimationFrame(() => paintRows(true));
  });
}

/* ------------------------------------------------------------------ menus with submenus */
// items: {label, fn, sub:[items], disabled} or null for a separator
function popMenu(x, y, items){
  closeCtx();
  const fns = [];
  const build = list => list.map(it => {
    if (!it) return "<hr>";
    if (it.sub) return `<div class="hassub ${it.disabled ? "dis" : ""}">${esc(it.label)}<div class="ctx subm">${build(it.sub)}</div></div>`;
    fns.push(it.fn);
    return `<div data-f="${fns.length - 1}" class="${it.disabled ? "dis" : ""}">${esc(it.label)}</div>`;
  }).join("");
  const m = document.createElement("div"); m.className = "ctx"; m.id = "ctx";
  m.innerHTML = build(items);
  document.body.appendChild(m);
  const r = m.getBoundingClientRect(), z = cssZoom, vw = innerWidth / z, vh = innerHeight / z;
  const left = Math.min(x / z, vw - r.width / z - 4);
  m.style.left = left + "px"; m.style.top = Math.min(y / z, vh - r.height / z - 4) + "px";
  if (left + r.width / z * 2 > vw) m.querySelectorAll(".subm").forEach(s => s.classList.add("left"));
  m.onclick = e => { const d = e.target.closest("[data-f]"); if (!d) return; closeCtx(); fns[+d.dataset.f](); };
}

function setView(v){ S.view = v; S.sel.clear(); S.anchor = S.cursor = null; S.listDirty = true; S.bsel = {genre:null, artist:null, album:null}; renderAll(); }

/* ------------------------------------------------------------------ list building */
function baseTracks(){
  if (!S.lib) return [];
  if (S.view === "music") return S.lib.tracks.filter(t => !t.video);
  if (S.view === "videos") return S.lib.tracks.filter(t => t.video);
  if (S.view.startsWith("v:")){ const mt = +S.view.slice(2); return S.lib.tracks.filter(t => t.video && (t.mediaType & mt)); }
  if (isPlView()){
    const p = curPlaylist();
    S.plIndex = new Map();
    if (!p) return [];
    p.trackIds.forEach((id, i) => { if (!S.plIndex.has(id)) S.plIndex.set(id, i); });
    return p.trackIds.map(id => S.byId.get(id)).filter(Boolean);
  }
  return S.lib.tracks.filter(t => !t.video);
}
function libCounts(){
  let songs = 0, videos = 0;
  for (const t of (S.lib ? S.lib.tracks : [])) t.video ? videos++ : songs++;
  return {songs, videos};
}
function searchFilter(list){
  const words = S.search.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return list;
  return list.filter(t => { const hay = `${t.title} ${t.artist||""} ${t.album||""} ${t.albumArtist||""} ${t.genre||""} ${t.composer||""}`.toLowerCase();
    return words.every(w => hay.includes(w)); });
}
function cmpBy(key){
  const s = (a, b) => { const x = sortKey(a), y = sortKey(b); return x < y ? -1 : x > y ? 1 : 0; };
  const albumOrder = (a, b) => s(a.album, b.album) || (a.discNumber||0) - (b.discNumber||0) || (a.trackNumber||0) - (b.trackNumber||0) || s(a.title, b.title);
  switch (key){
    case "artist": return (a, b) => s(a.albumArtist || a.artist, b.albumArtist || b.artist) || albumOrder(a, b);
    case "album": return albumOrder;
    case "genre": return (a, b) => s(a.genre, b.genre) || s(a.artist, b.artist) || albumOrder(a, b);
    case "title": return (a, b) => s(a.title, b.title) || s(a.artist, b.artist);
    case "type": return (a, b) => s(fileType(a), fileType(b)) || s(a.artist, b.artist) || albumOrder(a, b);
    default: return (a, b) => ((a[key]||0) - (b[key]||0)) || s(a.artist, b.artist) || albumOrder(a, b);
  }
}
function buildList(){
  if (!S.listDirty) return S.list;
  let list = searchFilter(baseTracks());
  if (S.browser && S.view !== "summary"){
    const {genre, artist, album} = S.bsel;
    if (genre !== null) list = list.filter(t => (t.genre||"") === genre);
    if (artist !== null) list = list.filter(t => (t.albumArtist || t.artist || "") === artist);
    if (album !== null) list = list.filter(t => (t.album||"") === album);
  }
  const srt = curSort();
  if (srt.key === "playlist"){
    if (srt.dir < 0) list = list.slice().reverse();
  } else {
    const c = cmpBy(srt.key);
    list = list.slice().sort((a, b) => c(a, b) * srt.dir);
  }
  S.list = list; S.listDirty = false;
  return list;
}

// Size a column to its widest value (and its heading).
function fitColumn(c){

  cv.font = getComputedStyle(probe).font;
  let max = cv.measureText(c.label).width + 18;
  const list = S.list.length > 20000 ? S.list.slice(0, 20000) : S.list;
  for (const t of list){ const w = cv.measureText(c.text(t)).width; if (w > max) max = w; }
  S.widths[c.key] = Math.min(900, Math.ceil(max / textScale) + 14);

function rejectList(list){

function handleDropCheck(d){

/* ------------------------------------------------------------------ sheets */
let sheetStack = [];
function sheet(html, onReady){
  closeCtx();
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(v);
  const onKey = e => {
    // Escape closes the sheet, except in a search box with text in it, where it clears the text
    if (e.key === "Escape" && e.target.hasAttribute && e.target.hasAttribute("data-escclear") && e.target.value) return;
    if (e.key === "Escape" && sheetStack[sheetStack.length-1] === close && !document.querySelector(".lightbox")){ e.preventDefault(); close(); }
  };
  const close = () => { v.remove(); removeEventListener("keydown", onKey, true); sheetStack = sheetStack.filter(x => x !== close); const sc = $("#tscroll"); sc && sc.focus(); };
  sheetStack.push(close);
  addEventListener("keydown", onKey, true);
  v.addEventListener("keydown", e => e.stopPropagation());
  onReady && onReady(v, close);
  const f = v.querySelector("[autofocus]") || v.querySelector("input,button.primary,button");
  f && f.focus();
  return close;
}
function alertSheet(title, msg){
  sheet(`<div class="sheet-h">${esc(title)}</div><div class="sheet-b"><p>${esc(msg)}</p></div><div class="sheet-f"><button class="btn primary" data-ok>OK</button></div>`,
    (v, close) => { v.querySelector("[data-ok]").onclick = close; });
}

/* ------------------------------------------------------------------ Get Info */
const FIELDS = [
  ["title","Name","text"],["artist","Artist","text"],["albumArtist","Album Artist","text"],["album","Album","text"],
  ["grouping","Grouping","text"],["composer","Composer","text"],["comment","Comments","area"],["genre","Genre","genre"],
  ["year","Year","num"],["track","Track","pair"],["disc","Disc","pair"],["bpm","BPM","num"],["rating","Rating","rating"],["compilation","Compilation","bool"],
];
function openInfo(){
  if (!canWrite() || !S.sel.size) return;
  const ids = S.list.filter(t => S.sel.has(t.id)).map(t => t.id);
  if (ids.length === 1) infoSheet(ids[0], null); else infoSheet(null, ids);
}
function infoSheet(singleId, multiIds){
  const multi = !!multiIds;
  const tracks = multi ? multiIds.map(id => S.byId.get(id)) : [S.byId.get(singleId)];
  const common = k => { const v = tracks[0][k]; return tracks.every(t => (t[k] ?? "") === (v ?? "")) ? (v ?? "") : undefined; };
  const genres = [...new Set(S.lib.tracks.map(t => t.genre).filter(Boolean))].sort();
  const val = k => { const v = common(k); return v === undefined ? "" : v; };
  const mixed = k => common(k) === undefined;
  const pick = k => multi ? `<input type="checkbox" class="pick" data-pick="${k}" aria-label="Change ${k}">` : "";
  const ro = (k, label) => `<label class="k" for="f_${k}">${label}</label>`;
  let rows = "";
  for (const [k, label, type] of FIELDS){
    if (type === "text") rows += ro(k, label) + `<div class="f">${pick(k)}<input type="text" id="f_${k}" data-f="${k}" value="${esc(val(k))}" class="${mixed(k) ? "mixed" : ""}" placeholder="${mixed(k) ? "Mixed" : ""}"></div>`;
    if (type === "area") rows += ro(k, label) + `<div class="f">${pick(k)}<textarea id="f_${k}" data-f="${k}" class="${mixed(k) ? "mixed" : ""}" placeholder="${mixed(k) ? "Mixed" : ""}">${esc(val(k))}</textarea></div>`;
    if (type === "genre") rows += ro(k, label) + `<div class="f">${pick(k)}<input type="text" id="f_${k}" data-f="${k}" list="genreList" value="${esc(val(k))}" class="${mixed(k) ? "mixed" : ""}" placeholder="${mixed(k) ? "Mixed" : ""}"><datalist id="genreList">${genres.map(g => `<option value="${esc(g)}">`).join("")}</datalist></div>`;
    if (type === "num") rows += ro(k, label) + `<div class="f">${pick(k)}<input type="number" min="0" max="65535" class="short ${mixed(k) ? "mixed" : ""}" id="f_${k}" data-f="${k}" value="${val(k) || ""}" placeholder="${mixed(k) ? "–" : ""}"></div>`;
    if (type === "pair"){
      const a = k === "track" ? "trackNumber" : "discNumber", b = k === "track" ? "trackCount" : "discCount";
      rows += ro(a, label) + `<div class="f">${pick(a)}<input type="number" min="0" max="999" class="short" id="f_${a}" data-f="${a}" value="${val(a) || ""}" placeholder="${mixed(a) ? "–" : ""}"><span class="of">of</span>${pick(b)}<input type="number" min="0" max="999" class="short" data-f="${b}" value="${val(b) || ""}" placeholder="${mixed(b) ? "–" : ""}" aria-label="${label} count"></div>`;
    }
    if (type === "rating"){ const r = common("rating"); rows += `<span class="k" style="text-align:right;color:var(--muted);font-size:12px">Rating</span><div class="f">${pick("rating")}<div class="rating-edit" data-r="${r === undefined ? -1 : r||0}">${[1,2,3,4,5].map(i => `<span data-s="${i}">★</span>`).join("")}<span class="x" data-s="0">Clear</span></div></div>`; }
    if (type === "bool"){ const c = common("compilation"); rows += `<span></span><div class="f">${pick("compilation")}<label class="check"><input type="checkbox" data-f="compilation" ${c ? "checked" : ""}>Part of a compilation</label></div>`; }
  }
  if (tracks.every(t => t.video)){
    const mt = common("mediaType");
    const opts = [[2, "Movie"], [32, "Music Video"], [64, "TV Show"]];
    rows += `<label class="k" for="f_mediaType">Video kind</label><div class="f">${pick("mediaType")}<select class="selbox" style="width:auto;min-width:150px" id="f_mediaType" data-f="mediaType">
      ${mt === undefined ? `<option value="" selected disabled>Mixed</option>` : ""}${opts.map(([v, l]) => `<option value="${v}" ${mt === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      <span class="of" title="Where it appears on the iPod’s Videos menu. TV shows are grouped by their Album name.">on the iPod’s Videos menu</span></div>`;
  }
  const t0 = tracks[0];
  const meta = "";
  const writeDef = store.get("writeTags", true);
  const listIdx = multi ? -1 : indexOfId(singleId);
  const cArtist = common("artist"), cAlbum = common("album");
  const head = multi
    ? [`${tracks.length.toLocaleString()} songs`, cArtist === undefined ? "Multiple artists" : (cArtist || "Unknown artist"), cAlbum === undefined ? "Multiple albums" : (cAlbum || "Unknown album"), fmtTime(tracks.reduce((s, t) => s + (t.lengthMs||0), 0))]
    : [t0.title, t0.artist || "Unknown artist", t0.album || "Unknown album",
       `${t0.kind || ""} · ${fmtTime(t0.lengthMs)} · ${t0.bitrate || "?"} kbps · ${((t0.sampleRate||0)/1000).toFixed(1)} kHz · ${fmtBytes(t0.size)}`];
  const playLine = multi ? "" : (t0.plays ? `Played ${plural(t0.plays, "time")}${t0.lastPlayed ? ", last on " + new Date(t0.lastPlayed*1000).toLocaleDateString() : ""}` : "Not played yet");
  const sameAlbum = !multi || (cAlbum !== undefined && cAlbum !== "");
  sheet(`<div class="info-head"><div class="art ${multi && !sameAlbum ? "stack" : ""}" id="infoArt" aria-label="Album artwork"><svg><use href="#i-note"/></svg></div>
      <div class="info-titles"><div class="it1" title="${esc(head[0])}">${esc(head[0])}</div><div class="it2">${esc(head[1])}</div><div class="it3">${esc(head[2])}</div><div class="it4" id="artCap">${esc(head[3])}</div>${playLine ? `<div class="it4 it5" title="${esc((t0.path||"").replace(/\//g, "\\"))}">${esc(playLine)}</div>` : ""}</div></div>
    <div class="sheet-b">
      ${multi ? `<p style="color:var(--muted);font-size:12px">Only the ticked fields change. Editing a field ticks it.</p>` : ""}
      <form class="form" id="infoForm" autocomplete="off">${rows}</form>${meta}</div>
    <div class="sheet-f"><div class="left">
      ${multi ? "" : `<button class="btn" data-prev ${listIdx <= 0 ? "disabled" : ""}>Previous</button><button class="btn" data-next ${listIdx < 0 || listIdx >= S.list.length-1 ? "disabled" : ""}>Next</button>`}
      <label class="check" title="Also write the changes into the song files' tags (ID3 / MP4)"><input type="checkbox" data-write ${writeDef ? "checked" : ""}>Update song files</label></div>
      <button class="btn" data-c>Cancel</button><button class="btn primary" data-ok>OK</button></div>`,
  (v, close) => {
    loadArt(v, sameAlbum ? tracks[0].id : null, head[3], multi);
    const form = v.querySelector("#infoForm");
    const touched = new Set();
    const rEl = v.querySelector(".rating-edit");
    let rating = +rEl.dataset.r;
    const paintStars = () => rEl.querySelectorAll("[data-s]").forEach(s => s.classList.toggle("on", +s.dataset.s > 0 && +s.dataset.s <= Math.round(rating/20)));
    paintStars();
    const markPick = k => { touched.add(k); const cb = v.querySelector(`[data-pick="${k}"]`); if (cb) cb.checked = true; };
    rEl.onclick = e => { const s = e.target.closest("[data-s]"); if (!s) return; rating = +s.dataset.s * 20; paintStars(); markPick("rating"); };
    form.addEventListener("input", e => { const k = e.target.dataset.f; if (k){ markPick(k); e.target.classList.remove("mixed"); } });
    form.addEventListener("change", e => { const k = e.target.dataset.f; if (k) markPick(k); });
    form.addEventListener("submit", e => { e.preventDefault(); save(true); });
    v.querySelectorAll("[data-pick]").forEach(cb => cb.addEventListener("change", () => { cb.checked ? touched.add(cb.dataset.pick) : touched.delete(cb.dataset.pick); }));
    const buildPatch = () => {
      const p = {};
      const include = k => multi ? !!(v.querySelector(`[data-pick="${k}"]`) || {}).checked : touched.has(k);
      v.querySelectorAll("[data-f]").forEach(el => {
        const k = el.dataset.f; if (!include(k)) return;
        if (el.type === "checkbox") p[k] = el.checked;
        else if (k === "mediaType"){ if (el.value !== "") p[k] = +el.value; }
        else if (el.type === "number") p[k] = el.value === "" ? 0 : Math.max(0, parseInt(el.value, 10) || 0);
        else p[k] = el.value;
      });
      if (include("rating") && rating >= 0) p.rating = rating;
      return p;
    };
    const save = async (andClose, after) => {
      const p = buildPatch(), write = v.querySelector("[data-write]").checked;
      store.set("writeTags", write);
      if (andClose) close();
      if (!Object.keys(p).length){ after && after(); return; }
      try { await api("update", multi ? multiIds : [singleId], p, write); pendingAfterJob = after || null; }
      catch(e){ alertSheet("Couldn’t save the changes", e.message); }
    };
    v.querySelector("[data-ok]").onclick = () => save(true);
    v.querySelector("[data-c]").onclick = close;
    v.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName !== "TEXTAREA"){ e.preventDefault(); save(true); } });
    const nav = d => {
      const ni = listIdx + d; const t = S.list[ni]; if (!t) return;
      S.sel.clear(); S.sel.add(t.id); S.anchor = S.cursor = t.id; scrollToIndex(ni); renderRows(true);
      save(true, () => infoSheet(t.id, null));
    };
    const pv = v.querySelector("[data-prev]"), nx = v.querySelector("[data-next]");
    if (pv) pv.onclick = () => nav(-1);
    if (nx) nx.onclick = () => nav(1);
    const first = v.querySelector("#f_title"); if (first){ first.focus(); first.select(); }
  });
}
let pendingAfterJob = null;
async function loadArt(v, id, cap, multi){
  const box = v.querySelector("#infoArt");

  let art = null;

  img.title = `${art.width} × ${art.height}` + (art.source === "ipod" ? " · stored on the iPod" : " · embedded in the song file") + " · click to enlarge";

  box.appendChild(img);
