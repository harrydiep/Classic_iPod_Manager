/* ------------------------------------------------------------------ artwork pane */
// The left pane's bottom shows the cover of the song last clicked, in the
// song list or the Format Manager.
const artPaneCache = new Map();
let artPaneTimer = null, artPaneKey = null;
function openLightbox(art){
  const lb = document.createElement("div"); lb.className = "lightbox";
  lb.innerHTML = `<div><img src="${art.dataUrl}" alt="Album artwork"><p>${art.width ? `${art.width} × ${art.height}` : ""}${art.source === "ipod" ? " · stored on the iPod" : ""}</p></div>`;
  const shut = e => { e && e.stopPropagation(); lb.remove(); removeEventListener("keydown", key, true); };
  const key = e => { if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); shut(); } };
  lb.onclick = shut; addEventListener("keydown", key, true);
  document.body.appendChild(lb);
}
function artPaneTarget(){
  if (S.view === "fm"){
    const it = FM.byKey.get(FM.cursor) && FM.sel.has(FM.cursor) ? FM.byKey.get(FM.cursor) : fmSelected()[0];
    if (!it) return null;
    return {key: "fm:" + it.key, title: fmTitle(it), sub: [fmVal(it, "artist"), fmVal(it, "album")].filter(Boolean).join(" — "),
      pending: it.art, load: () => api("fmArtwork", it.source, it.path, it.trackId || 0)};
  }
  if (!S.lib || !S.sel.size) return null;
  const id = S.sel.has(S.cursor) ? S.cursor : [...S.sel][0];
  const t = S.byId.get(id); if (!t) return null;
  return {key: "t:" + id, title: t.title, sub: [t.artist, t.album].filter(Boolean).join(" — "), load: () => api("artwork", id)};
}
function updateArtPane(){
  clearTimeout(artPaneTimer);
  artPaneTimer = setTimeout(paintArtPane, 90);
}
async function paintArtPane(){
  const pane = $("#artPane"); if (!pane) return;
  const closed = !!store.get("artPaneClosed", false);
  const tgt = artPaneTarget();
  const head = `<button class="ah" id="artPaneToggle" aria-expanded="${!closed}"><span class="car">▼</span>${tgt ? "Selected Item" : "Artwork"}</button>`;
  pane.classList.toggle("closed", closed);
  if (!tgt){
    artPaneKey = null;
    pane.innerHTML = head + `<div class="ab"><div class="empty-note">${S.lib || FM.items.length ? "Select a song or video to see its artwork" : "Nothing selected"}</div></div>`;
    bindArtPane(pane);
    return;
  }
  const show = (art, note) => {
    const img = art ? `<img src="${art.dataUrl}" alt="Artwork for ${esc(tgt.title)}" title="${art.width ? `${art.width} × ${art.height} · ` : ""}Click to enlarge">` : "";
    pane.innerHTML = head + `<div class="ab"><div class="sq">${img || `<svg><use href="#i-note"/></svg><div class="none">${esc(note || "No artwork")}</div>`}</div>
      <div class="cap"><b title="${esc(tgt.title)}">${esc(tgt.title)}</b><span title="${esc(tgt.sub)}">${esc(tgt.sub || "")}</span></div></div>`;
    bindArtPane(pane);
    const im = pane.querySelector("img"); if (im) im.onclick = () => openLightbox(art);
  };
  if (tgt.pending){
    if (tgt.pending.action === "remove") show(null, "Will be removed");
    else show({dataUrl: tgt.pending.dataUrl, width: tgt.pending.w, height: tgt.pending.h});
    return;
  }
  artPaneKey = tgt.key;
  if (artPaneCache.has(tgt.key)){ show(artPaneCache.get(tgt.key)); return; }
  if (closed){ show(null, ""); return; }
  if (!pane.querySelector(".sq")) show(null, "");
  let art = null;
  try { art = await tgt.load(); } catch(e){}
  if (artPaneCache.size > 300) artPaneCache.delete(artPaneCache.keys().next().value);
  artPaneCache.set(tgt.key, art);
  if (artPaneKey === tgt.key) show(art);
}
function bindArtPane(pane){
  const b = pane.querySelector("#artPaneToggle");
  if (b) b.onclick = () => { store.set("artPaneClosed", !store.get("artPaneClosed", false)); paintArtPane(); };
}
function resetArtPane(){ artPaneCache.clear(); updateArtPane(); }

/* ------------------------------------------------------------------ format manager */
// Songs from the computer or the iPod, with pending tag/artwork edits.
// item: {key, source, path, trackId, name, info, error, edits:{}, art:null|{action,path,dataUrl}, status}
const FM = {
  items: [], byKey: new Map(), sel: new Set(), anchor: null, cursor: null, list: [],
  artCache: new Map(), encoders: null,
  format: store.get("fmFormat", "aac"), quality: store.get("fmQuality", {}), addToIPod: store.get("fmAddToIPod", true),
  strip: store.get("fmStrip", []),
};
// the details the converter can leave out of new files
const FM_STRIP = [["title","Name"],["artist","Artist"],["albumArtist","Album Artist"],["album","Album"],["genre","Genre"],["year","Year"],
  ["track","Track number"],["disc","Disc number"],["composer","Composer"],["grouping","Grouping"],["comment","Comments"],["bpm","BPM"],
  ["compilation","Compilation"],["artwork","Album artwork"]];
if (!Array.isArray(FM.strip)) FM.strip = [];
FM.strip = FM.strip.filter(k => FM_STRIP.some(x => x[0] === k));
function fmStripSummary(){
  const n = FM.strip.length;
  if (!n) return "all kept";
  if (n === FM_STRIP.length) return "none kept";
  const names = FM_STRIP.filter(x => FM.strip.includes(x[0])).map(x => x[1]);
  return "leaving out " + (names.length <= 3 ? names.join(", ") : `${names.slice(0, 2).join(", ")} and ${names.length - 2} more`);
}
function fmChooseDetails(){
  const chosen = new Set(FM_STRIP.map(x => x[0]).filter(k => !FM.strip.includes(k)));
  sheet(`<div class="sheet-h">Details in converted files</div><div class="sheet-b">
      <p class="fm-help" style="margin:0 0 12px">Ticked details are copied into the converted files; unticked ones are left out. Songs on the iPod keep their details in the iPod’s own library, so they still show up properly there. The copy in Converted Music is still filed by artist and album.</p>
      <div class="keep-grid">${FM_STRIP.map(([k, l]) => `<label class="check"><input type="checkbox" data-k="${k}" ${chosen.has(k) ? "checked" : ""}>${l}</label>`).join("")}</div></div>
    <div class="sheet-f"><div class="left"><button class="btn" data-all>Keep All</button><button class="btn" data-none>Remove All</button></div>
      <button class="btn" data-c>Cancel</button><button class="btn primary" data-ok>Done</button></div>`,
  (v, close) => {
    const boxes = [...v.querySelectorAll("[data-k]")];
    v.querySelector("[data-all]").onclick = () => boxes.forEach(b => b.checked = true);
    v.querySelector("[data-none]").onclick = () => boxes.forEach(b => b.checked = false);
    v.querySelector("[data-c]").onclick = close;
    v.querySelector("[data-ok]").onclick = () => {
      FM.strip = boxes.filter(b => !b.checked).map(b => b.dataset.k);
      store.set("fmStrip", FM.strip);
      close(); fmRenderSide();
    };
  });
}
const FM_FIELDS = [
  ["title","Name","text"],["artist","Artist","text"],["albumArtist","Album Artist","text"],["album","Album","text"],
  ["genre","Genre","genre"],["year","Year","num"],["track","Track","pair"],["disc","Disc","pair"],
  ["composer","Composer","text"],["grouping","Grouping","text"],["comment","Comments","area"],["bpm","BPM","num"],["compilation","Compilation","bool"],
];
const FM_NUM = new Set(["year","trackNumber","trackCount","discNumber","discCount","bpm"]);
const IMG_EXT = /\.(jpe?g|png|gif)$/i;

function fmOrig(it, k){
  const t = (it.info && it.info.tags) || {};
  if (k === "compilation") return !!t.compilation;
  if (FM_NUM.has(k)) return t[k] || 0;
  return t[k] || "";
}
function fmVal(it, k){ return it.edits && k in it.edits ? it.edits[k] : fmOrig(it, k); }
function fmDirty(it){ return !!((it.edits && Object.keys(it.edits).length) || it.art); }
function fmTitle(it){ return fmVal(it, "title") || it.name; }
function fmSelected(){ return FM.items.filter(i => FM.sel.has(i.key)); }
function fmBusy(){ return S.busy && (S.busy.job === "convert" || S.busy.job === "retag"); }

function fmAdd(items){
  const bad = [];
  let added = 0;
  for (const it of items || []){
    if (it.error){ bad.push({item: it.path, message: it.error}); continue; }
    if (FM.byKey.has(it.key)) continue;
    it.edits = {}; it.art = null; it.status = null;
    FM.items.push(it); FM.byKey.set(it.key, it); added++;
  }
  if (S.view !== "fm") setView("fm"); else renderMain();
  renderSidebar();
  if (added) flash(`Added ${plural(added, "song")}`, "to the Format Manager");
  if (bad.length){
    sheet(`<div class="sheet-h">${bad.length === 1 ? "1 file couldn’t be added" : `${bad.length.toLocaleString()} files couldn’t be added`}</div>
      <div class="sheet-b"><p>These aren’t songs Classic iPod Manager can read.</p>${rejectList(bad)}</div>
      <div class="sheet-f"><button class="btn primary" data-ok>OK</button></div>`, (v, close) => { v.querySelector("[data-ok]").onclick = close; });
  }
}
async function fmAddPaths(paths){
  if (!paths || !paths.length) return;
  flash("Reading songs…", "");
  try { fmAdd(await api("fmInspect", paths)); }
  catch(e){ alertSheet("Couldn’t read the songs", e.message); }
}
async function fmAddFiles(){ try { await fmAddPaths(await api("fmPickFiles")); } catch(e){ alertSheet("Couldn’t add songs", e.message); } }
async function fmAddFolder(){ try { await fmAddPaths(await api("fmPickFolder")); } catch(e){ alertSheet("Couldn’t add the folder", e.message); } }
async function fmAddIPod(ids){
  if (!ids.length) return;
  try {
    const items = await api("fmFromIPod", ids);
    fmAdd(items);
    FM.sel = new Set(items.map(i => i.key)); renderMain();
  } catch(e){ alertSheet("Couldn’t add the songs", e.message); }
}
function fmRemoveSelected(){
  if (fmBusy() || !FM.sel.size) return;
  FM.items = FM.items.filter(i => !FM.sel.has(i.key));
  for (const k of FM.sel){ FM.byKey.delete(k); FM.artCache.delete(k); }
  FM.sel.clear(); FM.anchor = FM.cursor = null;
  renderMain(); renderSidebar();
}
function fmClear(){
  if (fmBusy()) return;
  const n = FM.items.filter(fmDirty).length;
  const doit = () => { FM.items = []; FM.byKey.clear(); FM.sel.clear(); FM.artCache.clear(); renderMain(); renderSidebar(); };
  if (!n){ doit(); return; }
  sheet(`<div class="sheet-h">Clear the list?</div><div class="sheet-b"><p>${plural(n, "song has", "songs have")} changes that haven’t been saved. Clearing the list throws them away.</p></div>
    <div class="sheet-f"><button class="btn" data-c>Cancel</button><button class="btn primary" data-ok>Clear List</button></div>`,
    (v, close) => { v.querySelector("[data-c]").onclick = close; v.querySelector("[data-ok]").onclick = () => { close(); doit(); }; });
}
function fmBuildList(){
  const words = S.search.toLowerCase().split(/\s+/).filter(Boolean);
  FM.list = !words.length ? FM.items : FM.items.filter(it => {
    const hay = `${fmVal(it,"title")} ${fmVal(it,"artist")} ${fmVal(it,"album")} ${it.name}`.toLowerCase();
    return words.every(w => hay.includes(w));
  });
  return FM.list;
}

function renderFM(m){
  const n = FM.items.length, dirty = FM.items.filter(fmDirty).length;
  m.innerHTML = `<div class="fm">
    <div class="fm-bar"><h2>Format Manager</h2>
      <button class="btn sm" id="fmFiles">Add Files…</button><button class="btn sm" id="fmFolder">Add Folder…</button>
      <button class="btn sm" id="fmRemove" ${FM.sel.size && !fmBusy() ? "" : "disabled"}>Remove from List</button>
      <button class="btn sm" id="fmClear" ${n && !fmBusy() ? "" : "disabled"}>Clear</button>
      <span class="sp"></span><span class="count">${n ? plural(n, "song") + (dirty ? ` · ${dirty.toLocaleString()} changed` : "") : ""}</span></div>
    <div class="fm-body">
      <div class="fm-list">
        <div class="fm-head"><span></span><span>Name</span><span>Artist</span><span>Album</span><span>Source</span><span>Format</span><span style="text-align:right">Bit Rate</span><span style="text-align:right">Time</span><span>Result</span></div>
        <div class="fm-scroll" id="fmScroll" tabindex="0" aria-label="Format Manager songs"><div class="fm-spacer" id="fmSpacer"></div></div>
        <div class="fm-empty ${n ? "hidden" : ""}" id="fmEmpty"><div><svg><use href="#i-convert"/></svg><div class="big">Edit and convert songs</div>
          <p>Drag songs here from Explorer, use Add Files, or right-click songs on your iPod and choose Format Manager.</p>
          <p>You can change their details and artwork, and convert them between MP3, AAC, Apple Lossless, WAV, AIFF, FLAC and Ogg Vorbis.</p></div></div>
      </div>
      <div class="fm-side" id="fmSide"></div>
    </div></div>`;
  $("#fmFiles").onclick = fmAddFiles; $("#fmFolder").onclick = fmAddFolder;
  $("#fmRemove").onclick = fmRemoveSelected; $("#fmClear").onclick = fmClear;
  const sc = $("#fmScroll");
  sc.addEventListener("scroll", () => fmRenderRows());
  fmBindList(sc);
  fmBuildList();
  fmRenderRows(true);
  fmRenderSide();
  if (!FM.encoders) fmLoadEncoders();
}
function fmStatusCell(it){
  if (it.status && it.status.kind === "ok") return `<span class="ok" title="${esc(it.status.text)}">✓</span>`;
  if (it.status && it.status.kind === "err") return `<span class="err" title="${esc(it.status.text)}">!</span>`;
  if (fmDirty(it)) return `<span class="dot" title="Changed – not saved yet"></span>`;
  return "";
}
let fmLastRange = "";
function fmRenderRows(force){
  const sc = $("#fmScroll"), sp = $("#fmSpacer"); if (!sc) return;
  const list = FM.list;
  sp.style.height = list.length * ROW + "px";
  const first = Math.max(0, Math.floor(sc.scrollTop / ROW) - 8), last = Math.min(list.length, Math.ceil((sc.scrollTop + sc.clientHeight) / ROW) + 8);
  const range = first + ":" + last;
  if (!force && range === fmLastRange) return;
  fmLastRange = range;
  let h = "";
  for (let i = first; i < last; i++){
    const it = list[i], inf = it.info || {};
    const res = it.status ? `<span class="fm-res ${it.status.kind}" title="${esc(it.status.text)}">${esc(it.status.short || it.status.text)}</span>` : "<span></span>";
    h += `<div class="fm-row ${i % 2 ? "odd" : ""} ${FM.sel.has(it.key) ? "sel" : ""}" style="top:${i*ROW}px" data-k="${esc(it.key)}" title="${esc(it.path)}">
      <span class="fm-st">${fmStatusCell(it)}</span><span>${esc(fmTitle(it))}</span><span>${esc(fmVal(it, "artist"))}</span><span>${esc(fmVal(it, "album"))}</span>
      <span><span class="chip ${it.source === "ipod" ? "ipod" : ""}">${it.source === "ipod" ? "iPod" : "Computer"}</span></span>
      <span ${inf.label && !inf.playable ? `title="An iPod can’t play ${esc(inf.label)} – convert it to add it to the iPod"` : ""}>${esc(inf.label || "")}</span>
      <span class="r m">${inf.bitrate ? inf.bitrate + " kbps" : ""}</span><span class="r m">${inf.lengthMs ? fmtTime(inf.lengthMs) : ""}</span>${res}</div>`;
  }
  sp.innerHTML = h;
}
function fmBindList(sc){
  sc.addEventListener("mousedown", e => {
    const row = e.target.closest(".fm-row"); sc.focus();
    if (!row){ if (!e.ctrlKey){ FM.sel.clear(); fmSelChanged(); } return; }
    const k = row.dataset.k, idx = FM.list.findIndex(i => i.key === k);
    if (e.shiftKey && FM.anchor !== null){
      const ai = FM.list.findIndex(i => i.key === FM.anchor);
      if (!e.ctrlKey) FM.sel.clear();
      const [lo, hi] = ai < idx ? [ai, idx] : [idx, ai];
      for (let i = lo; i <= hi; i++) if (FM.list[i]) FM.sel.add(FM.list[i].key);
    } else if (e.ctrlKey){
      FM.sel.has(k) ? FM.sel.delete(k) : FM.sel.add(k); FM.anchor = k;
    } else {
      if (!(e.button === 2 && FM.sel.has(k))){ FM.sel.clear(); FM.sel.add(k); }
      FM.anchor = k;
    }
    FM.cursor = k;
    fmSelChanged();
    if (e.button === 0 && e.detail === 2 && !e.ctrlKey && !e.shiftKey && idx >= 0) playEntries(FM.list.map(fmEntry), idx);
  });
  sc.addEventListener("keydown", e => {
    if (e.ctrlKey && e.key.toLowerCase() === "a"){ e.preventDefault(); FM.sel = new Set(FM.list.map(i => i.key)); fmSelChanged(); return; }
    if (e.key === "Delete"){ e.preventDefault(); fmRemoveSelected(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      let i = FM.list.findIndex(x => x.key === FM.cursor);
      i = Math.max(0, Math.min(FM.list.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
      const it = FM.list[i]; if (!it) return;
      if (!e.shiftKey){ FM.sel.clear(); FM.anchor = it.key; }
      FM.sel.add(it.key); FM.cursor = it.key;
      const top = i * ROW; if (top < sc.scrollTop) sc.scrollTop = top; else if (top + ROW > sc.scrollTop + sc.clientHeight) sc.scrollTop = top + ROW - sc.clientHeight;
      fmSelChanged();
    }
  });
  sc.addEventListener("contextmenu", e => {
    const row = e.target.closest(".fm-row"); if (!row || !FM.sel.size) return;
    e.preventDefault();
    const items = [["Remove from List", fmRemoveSelected]];
    const sel = fmSelected();
    if (sel.length === 1 && sel[0].source === "file") items.unshift(["Show in Explorer", () => api("revealFile", sel[0].path).catch(e => alertSheet("Couldn’t show the file", e.message))]);
    if (sel.length === 1 && sel[0].source === "ipod") items.unshift(["Show in Explorer", () => api("reveal", sel[0].trackId).catch(e => alertSheet("Couldn’t show the file", e.message))]);
    if (sel.length === 1 && sel[0].status && sel[0].status.output) items.unshift(["Show Converted File", () => api("revealFile", sel[0].status.output).catch(e => alertSheet("Couldn’t show the file", e.message))]);
    fmCtx(e.clientX, e.clientY, items);
  });
}
function fmCtx(x, y, items){
  closeCtx();
  const m = document.createElement("div"); m.className = "ctx"; m.id = "ctx";
  m.innerHTML = items.map((it, i) => `<div data-i="${i}">${esc(it[0])}</div>`).join("");
  document.body.appendChild(m);
  const r = m.getBoundingClientRect(), z = cssZoom;
  m.style.left = Math.min(x / z, innerWidth / z - r.width / z - 4) + "px"; m.style.top = Math.min(y / z, innerHeight / z - r.height / z - 4) + "px";
  m.onclick = e => { const d = e.target.closest("[data-i]"); if (!d) return; closeCtx(); items[+d.dataset.i][1](); };
}
function fmSelChanged(){
  updateArtPane();
  fmRenderRows(true);
  fmRenderSide();
  const rb = $("#fmRemove"); if (rb) rb.disabled = !FM.sel.size || fmBusy();
}

/* the side panel: artwork, details, convert */
function fmCommon(items, k){
  const v = fmVal(items[0], k);
  return items.every(i => fmVal(i, k) === v) ? v : undefined;
}
function fmRenderSide(){
  const side = $("#fmSide"); if (!side) return;
  const sel = fmSelected(), busy = fmBusy();
  const targets = sel.length ? sel : FM.items;
  const dirtyAll = FM.items.filter(fmDirty);
  const convertN = targets.filter(i => !i.error).length;
  const convertLabel = sel.length ? `Convert ${plural(sel.length, "Song")}` : (FM.items.length ? `Convert All (${FM.items.length.toLocaleString()})` : "Convert");
  let h = `<div class="scroll">`;
  if (!sel.length){
    h += `<div class="fm-title">${FM.items.length ? "No songs selected" : "Format Manager"}</div>
      <div class="fm-sub">${FM.items.length ? "Select songs to change their details or artwork." : "Add songs to get started."}</div>`;
  } else {
    const one = sel.length === 1 ? sel[0] : null;
    const cArtist = fmCommon(sel, "artist"), cAlbum = fmCommon(sel, "album");
    h += `<div class="fm-title">${esc(one ? fmTitle(one) : plural(sel.length, "song") + " selected")}</div>
      <div class="fm-sub">${esc(one ? [one.info && one.info.label, one.info && one.info.bitrate ? one.info.bitrate + " kbps" : "", one.info && one.info.sampleRate ? (one.info.sampleRate/1000).toFixed(1) + " kHz" : "", one.info && one.info.bits ? one.info.bits + "-bit" : "", one.info && fmtBytes(one.info.size)].filter(Boolean).join(" · ")
        : [cArtist === undefined ? "Multiple artists" : (cArtist || "Unknown artist"), cAlbum === undefined ? "Multiple albums" : (cAlbum || "Unknown album")].join(" · "))}</div>`;
    const noTags = sel.filter(i => i.info && !i.info.tagsInFile && i.source === "file").length;
    h += `<div class="fm-artrow"><div class="art" id="fmArt" aria-label="Album artwork"><svg><use href="#i-note"/></svg></div>
      <div class="fm-artbtns"><button class="btn sm" id="fmArtPick" ${busy ? "disabled" : ""}>Choose Artwork…</button>
        <button class="btn sm" id="fmArtRemove" ${busy ? "disabled" : ""}>Remove Artwork</button>
        <button class="btn sm hidden" id="fmArtUndo">Undo Artwork Change</button>
        <span class="note" id="fmArtNote">You can also drop a picture here.</span></div></div>`;
    h += `<div class="fm-sec">Details</div><form class="form" id="fmForm" autocomplete="off">`;
    const genres = [...new Set([...(S.lib ? S.lib.tracks.map(t => t.genre) : []), ...FM.items.map(i => fmVal(i, "genre"))].filter(Boolean))].sort();
    const field = (k, label, type) => {
      const c = fmCommon(sel, k), mixed = c === undefined, edited = sel.some(i => i.edits && k in i.edits);
      const cls = `${mixed ? "mixed" : ""} ${edited ? "edited" : ""}`;
      const ph = mixed ? (type === "num" ? "–" : "Mixed") : "";
      if (type === "area") return `<label class="k" for="fm_${k}">${label}</label><div class="f"><textarea id="fm_${k}" data-f="${k}" class="${cls}" placeholder="${ph}">${esc(mixed ? "" : c)}</textarea></div>`;
      if (type === "num") return `<input type="number" min="0" max="65535" class="short ${cls}" id="fm_${k}" data-f="${k}" value="${mixed || !c ? "" : c}" placeholder="${ph}">`;
      return `<label class="k" for="fm_${k}">${label}</label><div class="f"><input type="text" id="fm_${k}" data-f="${k}" ${type === "genre" ? 'list="fmGenres"' : ""} value="${esc(mixed ? "" : c)}" class="${cls}" placeholder="${ph}"></div>`;
    };
    for (const [k, label, type] of FM_FIELDS){
      if (type === "text" || type === "area" || type === "genre") h += field(k, label, type);
      if (type === "num") h += `<label class="k" for="fm_${k}">${label}</label><div class="f">${field(k, label, "num")}</div>`;
      if (type === "pair"){
        const a = k === "track" ? "trackNumber" : "discNumber", b = k === "track" ? "trackCount" : "discCount";
        h += `<label class="k" for="fm_${a}">${label}</label><div class="f">${field(a, label, "num")}<span class="of">of</span>${field(b, label, "num")}</div>`;
      }
      if (type === "bool"){
        const c = fmCommon(sel, "compilation");
        h += `<span></span><div class="f"><label class="check"><input type="checkbox" data-f="compilation" ${c ? "checked" : ""}>Part of a compilation${c === undefined ? " (mixed)" : ""}</label></div>`;
      }
    }
    h += `</form><datalist id="fmGenres">${genres.map(g => `<option value="${esc(g)}">`).join("")}</datalist>`;
    if (noTags) h += `<p class="fm-help">${noTags === 1 ? "One song is" : `${noTags} songs are`} WAV or AIFF, which can’t store details or artwork. Convert ${noTags === 1 ? "it" : "them"} to keep the changes.</p>`;
  }
  // convert controls and actions stay visible at the bottom
  const fmts = (FM.encoders && FM.encoders.formats) || [];
  const f = fmts.find(x => x.id === FM.format) || fmts[0];
  h += `</div><div class="fm-conv">`;
  let canConvert = false;
  if (f){
    const q = FM.quality[f.id] || (f.qualities.find(x => x.default) || f.qualities[0]).id;
    const st = (FM.encoders.encoders || []).find(x => x.id === f.id) || {};
    canConvert = f.builtin || !!st.active;
    const opt = x => `<option value="${x.id}" ${x.id === f.id ? "selected" : ""}>${esc(x.label)}</option>`;
    const canAdd = S.lib && !S.lib.readOnly && f.ipod && targets.some(i => i.source === "file");
    const fromIPod = targets.some(i => i.source === "ipod");
    h += `<div class="fm-sec" style="margin-top:2px">Convert to</div>
      <div class="fm-convsel">
        <select class="selbox" id="fmFormat" aria-label="Format" ${busy ? "disabled" : ""}><optgroup label="Plays on an iPod">${fmts.filter(x => x.ipod).map(opt).join("")}</optgroup><optgroup label="For the computer only">${fmts.filter(x => !x.ipod).map(opt).join("")}</optgroup></select>
        <select class="selbox" id="fmQuality" aria-label="${f.lossless ? "Quality" : "Bit rate"}" ${busy || f.qualities.length < 2 ? "disabled" : ""}>${f.qualities.map(x => `<option value="${x.id}" ${x.id === q ? "selected" : ""}>${esc(x.label)}</option>`).join("")}</select>
      </div>
      ${f.builtin ? `<div class="enc-line ok">Written by Classic iPod Manager – no encoder needed${f.id === "wav" || f.id === "aiff" ? ". " + esc(f.label) + " files can’t hold details or artwork" : ""}.</div>`
        : st.active ? `<div class="enc-line ok">Encoder: <b>${esc(st.active)}</b>${st.from ? ` (from the ${esc(st.from)} folder)` : ""} · <button class="linkbtn" data-open="${st.from ? (FM.encoders.encoders.find(x => x.label === st.from) || {}).id || f.id : f.id}">Show folder</button></div>`
        : `<div class="enc-line bad">No ${esc(f.label)} encoder found. Put ${esc(f.hint)} in the <button class="linkbtn" data-open="${f.id}">${esc((st.folder || "").split(/[\\/]/).pop() || f.label)} folder</button> or choose one in <button class="linkbtn" data-opts>Options</button>.</div>`}
      ${f.id === "wav" || f.id === "aiff" ? "" : `<div class="fm-keep ${FM.strip.length ? "some" : ""}">Details: <b>${esc(fmStripSummary())}</b> · <button class="linkbtn" id="fmKeep" ${busy ? "disabled" : ""}>Choose…</button></div>`}
      <label class="check" ${canAdd ? "" : `title="${f.ipod ? "Connect an iPod to add songs to it" : esc(f.label) + " can’t play on an iPod"}"`}><input type="checkbox" id="fmAddIPod" ${FM.addToIPod && canAdd ? "checked" : ""} ${canAdd && !busy ? "" : "disabled"}>Add converted computer songs to the iPod</label>
      <p class="fm-help">${fromIPod ? (f.ipod ? "iPod songs are backed up to <button class=\"linkbtn\" data-open=\"originals\">iPod Originals</button>, then replaced on the iPod. " : `${esc(f.label)} can’t play on an iPod, so iPod songs stay as they are. `) : ""}Copies go to <button class="linkbtn" data-open="converted">Converted Music</button>.</p>`;
  }
  h += `<div class="acts">
    <button class="btn" id="fmSave" ${dirtyAll.length && !busy ? "" : "disabled"} title="Write the changed details and artwork into the songs, without converting">Save Changes</button>
    <button class="btn primary" id="fmConvert" ${convertN && !busy && canConvert ? "" : "disabled"}>${convertLabel}</button></div></div>`;
  side.innerHTML = h;
  fmBindSide(side, sel);
}
function fmBindSide(side, sel){
  side.querySelectorAll("[data-open]").forEach(b => b.onclick = () => api("openFolder", b.dataset.open).catch(e => alertSheet("Couldn’t open the folder", e.message)));
  side.querySelectorAll("[data-opts]").forEach(b => b.onclick = () => openOptions("encoders"));
  const fs = side.querySelector("#fmFormat");
  if (fs) fs.onchange = () => { FM.format = fs.value; store.set("fmFormat", FM.format); fmRenderSide(); };
  const qs = side.querySelector("#fmQuality");
  if (qs) qs.onchange = () => { FM.quality[FM.format] = qs.value; store.set("fmQuality", FM.quality); };
  const kp = side.querySelector("#fmKeep");
  if (kp) kp.onclick = fmChooseDetails;
  const ai = side.querySelector("#fmAddIPod");
  if (ai) ai.onchange = () => { FM.addToIPod = ai.checked; store.set("fmAddToIPod", ai.checked); };
  side.querySelector("#fmSave").onclick = () => fmRun(false);
  side.querySelector("#fmConvert").onclick = () => fmRun(true);
  if (!sel.length) return;
  fmPaintArt(sel);
  side.querySelector("#fmArtPick").onclick = async () => {
    try { const img = await api("fmPickImage"); if (img) fmSetArt(fmSelected(), {action:"set", path: img.path, dataUrl: img.art.dataUrl, w: img.art.width, h: img.art.height}); }
    catch(e){ alertSheet("Couldn’t use the picture", e.message); }
  };
  side.querySelector("#fmArtRemove").onclick = () => fmSetArt(fmSelected(), {action:"remove"});
  side.querySelector("#fmArtUndo").onclick = () => fmSetArt(fmSelected(), null);
  const form = side.querySelector("#fmForm");
  const onEdit = e => {
    const k = e.target.dataset.f; if (!k) return;
    let v = e.target.type === "checkbox" ? e.target.checked : e.target.value;
    if (FM_NUM.has(k)) v = v === "" ? 0 : Math.max(0, parseInt(v, 10) || 0);
    for (const it of fmSelected()){
      if (v === fmOrig(it, k)) delete it.edits[k]; else it.edits[k] = v;
    }
    e.target.classList.remove("mixed");
    e.target.classList.toggle("edited", fmSelected().some(i => k in i.edits));
    fmRenderRows(true); fmRefreshCounts();
  };
  form.addEventListener("input", onEdit);
  form.addEventListener("change", onEdit);
  form.addEventListener("submit", e => e.preventDefault());
  form.addEventListener("keydown", e => { if (e.key === "Escape"){ e.target.blur(); } e.stopPropagation(); });
}
function fmRefreshCounts(){
  // update the counters and buttons without redrawing the form being typed in
  const dirty = FM.items.filter(fmDirty).length;
  const c = $(".fm-bar .count"); if (c) c.textContent = FM.items.length ? plural(FM.items.length, "song") + (dirty ? ` · ${dirty.toLocaleString()} changed` : "") : "";
  const sb = $("#fmSave"); if (sb) sb.disabled = !dirty || fmBusy();
}
function fmSetArt(items, art){
  for (const it of items) it.art = art;
  updateArtPane();
  fmPaintArt(items); fmRenderRows(true); fmRefreshCounts();
}
async function fmPaintArt(sel){
  const box = $("#fmArt"); if (!box) return;
  const note = $("#fmArtNote"), undo = $("#fmArtUndo");
  const set = (html, text) => { box.innerHTML = html; if (note) note.textContent = text; };
  const pending = sel[0].art, same = sel.every(i => JSON.stringify(i.art) === JSON.stringify(pending));
  if (undo) undo.classList.toggle("hidden", !sel.some(i => i.art));
  if (pending && same){
    if (pending.action === "remove"){ set(`<svg><use href="#i-note"/></svg><div class="none">Will be removed</div>`, "The artwork will be removed when you save or convert."); return; }
    set(`<img src="${pending.dataUrl}" alt="New album artwork">`, `New artwork${pending.w ? ` (${pending.w} × ${pending.h})` : ""} – saved when you save or convert.`);
    return;
  }
  if (!same){ set(`<svg><use href="#i-note"/></svg><div class="none">Mixed</div>`, "Some songs have new artwork."); return; }
  const cAlbum = fmCommon(sel, "album");
  if (sel.length > 1 && cAlbum === undefined){ set(`<svg><use href="#i-note"/></svg><div class="none">Multiple albums</div>`, "Choosing artwork sets it for every selected song."); return; }
  const it = sel[0];
  let art = FM.artCache.get(it.key);
  if (art === undefined){
    set(`<svg><use href="#i-note"/></svg>`, "");
    try { art = await api("fmArtwork", it.source, it.path, it.trackId || 0); } catch(e){ art = null; }
    FM.artCache.set(it.key, art);
    if (!box.isConnected || !FM.sel.has(it.key)) return;
  }
  if (!art){ set(`<svg><use href="#i-note"/></svg><div class="none">No artwork</div>`, "You can also drop a picture here."); return; }
  set(`<img src="${art.dataUrl}" alt="Album artwork" title="${art.width} × ${art.height}">`, `${art.width} × ${art.height}${art.source === "ipod" ? " · on the iPod" : ""}. You can also drop a picture here.`);
}

async function fmRun(convert){
  if (fmBusy()) return;
  const sel = fmSelected();
  let items = convert ? (sel.length ? sel : FM.items) : FM.items.filter(fmDirty);
  items = items.filter(i => !i.error);
  if (!items.length) return;
  const req = {
    convert, format: FM.format, quality: FM.quality[FM.format] || "", strip: convert ? FM.strip : [], addToIPod: !!($("#fmAddIPod") && $("#fmAddIPod").checked),
    items: items.map(it => {
      const patch = {};
      for (const [k, v] of Object.entries(it.edits || {})) patch[k] = v;
      return {key: it.key, source: it.source, path: it.path, trackId: it.trackId || 0, patch,
        art: it.art ? it.art.action : "", artPath: it.art && it.art.path || ""};
    }),
  };
  const go = async () => {
    for (const it of items) it.status = {kind: "work", text: convert ? "Waiting…" : "Saving…", short: convert ? "Waiting…" : "Saving…"};
    fmRenderRows(true);
    try { await api("fmRun", req); }
    catch(e){
      for (const it of items) it.status = null;
      fmRenderRows(true);
      alertSheet(convert ? "Can’t convert yet" : "Couldn’t save the changes", e.message);
    }
  };
  const f = FM.encoders && FM.encoders.formats.find(x => x.id === FM.format);
  const fromIPod = items.filter(i => i.source === "ipod").length;
  if (convert && fromIPod && f && f.ipod){
    sheet(`<div class="sheet-h">Replace ${plural(fromIPod, "song")} on the iPod?</div><div class="sheet-b">
      <p>${fromIPod === 1 ? "The song" : "These songs"} will be converted to ${esc(f.label)} and replaced on the iPod. ${fromIPod === 1 ? "Its" : "Their"} play counts, ratings and playlists stay as they are.</p>
      <p>The original files are copied to the iPod Originals folder first, so you can go back if you need to.</p></div>
      <div class="sheet-f"><button class="btn" data-c>Cancel</button><button class="btn primary" data-ok>Convert and Replace</button></div>`,
      (v, close) => { v.querySelector("[data-c]").onclick = close; v.querySelector("[data-ok]").onclick = () => { close(); go(); }; });
    return;
  }
  go();
}
function fmApplyOutcomes(r){
  const convert = r.job === "convert";
  const seen = new Set();
  for (const o of r.fm || []){
    const it = FM.byKey.get(o.key); if (!it) continue;
    seen.add(o.key);
    if (o.ok){
      // Converting a computer song leaves its own file as it was, so its
      // edits stay pending (they can still be saved to it).
      if (!(convert && it.source === "file")){ it.edits = {}; it.art = null; }
      FM.artCache.delete(o.key);
      if (o.item && !o.item.error){ it.info = o.item.info; it.path = o.item.path; }
      const name = o.output ? o.output.split(/[\\/]/).pop() : "";
      it.status = convert ? {kind: "ok", text: (o.note ? o.note + ". " : "") + (o.output ? "Saved as " + o.output : "Converted"), short: o.note ? "Copied" : "Converted", output: o.output}
                          : {kind: "ok", text: "Changes saved", short: "Saved"};
    } else {
      it.status = {kind: "err", text: o.error || "Failed", short: "Failed"};
    }
  }
  for (const it of FM.items) if (it.status && it.status.kind === "work" && !seen.has(it.key)) it.status = r.cancelled ? {kind: "err", text: "Stopped", short: "Stopped"} : null;
  if (S.view === "fm") renderMain();
}
async function fmHandleDrop(paths){
  S.flash = null; renderLCD();
  paths = paths || [];
  const images = paths.filter(p => IMG_EXT.test(p)), songs = paths.filter(p => !IMG_EXT.test(p));
  if (images.length && FM.sel.size){
    try { const img = await api("fmImagePreview", images[0]); fmSetArt(fmSelected(), {action:"set", path: img.path, dataUrl: img.art.dataUrl, w: img.art.width, h: img.art.height}); flash("New artwork", `for ${plural(FM.sel.size, "song")}`); }
    catch(e){ alertSheet("Couldn’t use the picture", e.message); }
  } else if (images.length && !songs.length){
    alertSheet("Select songs first", "Select the songs the picture is for, then drop it again.");
  }
  if (songs.length) await fmAddPaths(songs);
}
async function fmLoadEncoders(){
  try { FM.encoders = await api("encoders"); } catch(e){ FM.encoders = null; }
  if (FM.encoders && !FM.encoders.formats.some(f => f.id === FM.format)) FM.format = "aac";
  if (S.view === "fm") fmRenderSide();
}

/* ------------------------------------------------------------------ jobs / events */
function jobSummary(r){
  const n = r.ok;
  switch (r.job){
    case "add": {
      const v = r.videos || 0, songs = n - v;
      const what = [songs ? plural(songs, "song") : "", v ? plural(v, "video") : ""].filter(Boolean).join(" and ");
      return [n ? `Added ${what}` : "Nothing added", r.converted ? `${plural(r.converted, "video")} converted for the iPod` : r.skipped ? `${r.skipped} already on the iPod` : ""];
    }
    case "remove": return [`Removed ${plural(n, "song")}`, ""];
    case "update": return [n === 1 ? "Info updated" : `Updated ${plural(n, "item")}`, ""];
    case "export": return [`Copied ${plural(n, "song")}`, "to your computer"];
    case "convert": {
      const added = (r.notes || []).map(x => /^Added (\d+) converted/.exec(x)).find(Boolean);
      return [n ? `Converted ${plural(n, "song")}` : "Nothing converted", added ? `Added ${plural(+added[1], "song")} to the iPod` : n ? "Copies are in Converted Music" : ""];
    }
    case "retag": return [n ? `Saved ${plural(n, "song")}` : "Nothing saved", ""];
  }
  return ["Done", ""];
}
async function onEvent(e){
  if (e.type === "progress"){
    const started = !S.busy;
    S.busy = {job:e.job, done:e.done||0, total:e.total||0, label:e.label,
      bytesDone:e.bytesDone||0, bytesTotal:e.bytesTotal||0, speed:e.speed||0, direction:e.direction||""};
    renderLCD(); if (started) updateButtons();
    if (started && S.view === "fm") renderMain();
    return;
  }
  if (e.type === "done"){
    S.busy = null;
    const r = e.result;
    if (r.job !== "export") await reload();
    updateButtons();
    if (r.error) alertSheet("Something went wrong", r.error + (r.ok ? ` (${plural(r.ok, "song")} finished before this happened.)` : ""));
    const [a, b] = jobSummary(r);
    flash(r.cancelled ? a + " (stopped)" : a, b);
    if (r.job === "convert" || r.job === "retag" || r.job === "update") resetArtPane();
    if (r.job === "convert" || r.job === "retag") fmApplyOutcomes(r);
    if (r.job === "convert" || r.job === "retag" || r.job === "add") fmLoadEncoders();
    const issues = r.errors || [], notes = (r.notes || []).filter(x => !/already on the iPod/.test(x) && !/^Converted copies are in/.test(x) && !/^Added \d+ converted/.test(x));
    if (issues.length || (notes.length && r.job !== "add") || (notes.length && !r.ok)){
      sheet(`<div class="sheet-h">${issues.length ? (issues.length === 1 ? "1 song had a problem" : `${issues.length} songs had problems`) : a}</div><div class="sheet-b">
        ${notes.map(n => `<p>${esc(n)}</p>`).join("")}
        ${issues.length ? `<div class="errlist">${issues.map(x => `<div><b title="${esc(x.item)}">${esc(x.item.split(/[\\/]/).pop())}</b><span>${esc(x.message)}</span></div>`).join("")}</div>` : ""}
        </div><div class="sheet-f"><button class="btn primary" data-ok>OK</button></div>`, (v, close) => { v.querySelector("[data-ok]").onclick = close; });
    }
    if (pendingAfterJob){ const f = pendingAfterJob; pendingAfterJob = null; f(); }
    return;
  }
  if (e.type === "drop"){ handleDropCheck(e.drop || {}); return; }
  if (e.type === "devices"){ S.devices = e.devices || []; if (!S.lib && S.devices.length === 1 && S.view !== "setup") openDevice(S.devices[0].root); renderAll(); return; }
  if (e.type === "deviceGone"){ if (P.cur && P.cur.id) stopPlayback(); setLib(null); S.view = "music"; renderAll(); flash("iPod disconnected", ""); }
}
window.__podEvent = e => { onEvent(e).catch(err => console.error(err)); };

/* ------------------------------------------------------------------ loading */
function setLib(lib){
  if (lib){ lib.tracks = lib.tracks || []; lib.playlists = lib.playlists || []; }
  S.lib = lib; S.byId = new Map(); S.listDirty = true;
  if (lib) for (const t of lib.tracks) S.byId.set(t.id, t);
  for (const id of [...S.sel]) if (!S.byId.has(id)) S.sel.delete(id);
  if (P.cur && P.cur.id){
    const t = S.byId.get(P.cur.id);
    if (!t) stopPlayback(); else Object.assign(P.cur, {title: t.title, artist: t.artist, album: t.album});
    P.queue = P.queue.filter(q => !q.id || S.byId.has(q.id));
    P.idx = P.queue.indexOf(P.cur);
  }
  const root = lib ? lib.device.root : null;
  if (root !== battRoot){ battRoot = root; S.batt = null; if (root) refreshBattery(); else hideBattPop(); }
  applyTheme();
}
async function reload(){
  try { setLib(await api("library")); } catch(e){ setLib(null); }
  if (isPlView() && !curPlaylist()) S.view = "music";
  if (isVideoView() && S.lib && !S.lib.device.model.video && !libCounts().videos) S.view = "music";
  renderAll();
}
async function openDevice(root){
  try {
    flash("Opening iPod…", "");
    setLib(await api("open", root));
    S.view = "music"; S.sel.clear(); S.flash = null;
  } catch(e){
    if (String(e.message).startsWith("NO_DATABASE")){ setLib(null); S.setupRoot = root; S.view = "setup"; S.flash = null; }
    else alertSheet("Couldn’t open the iPod", e.message);
  }
  renderAll();
}
function renderStats(){
  const st = $("#stats"), mc = $("#miniCap");
  if (!S.lib){ st.textContent = ""; mc.innerHTML = ""; return; }
  if (S.view === "summary"){ st.textContent = ""; }
  else {
    const list = S.listDirty ? buildList() : S.list;
    const ms = list.reduce((s, t) => s + (t.lengthMs||0), 0), b = list.reduce((s, t) => s + (t.size||0), 0);
    const selN = S.sel.size;
    const word = isVideoView() ? "video" : S.view.startsWith("pl:") ? "item" : "song";
    st.textContent = `${plural(list.length, word)}, ${fmtTotal(ms)}, ${fmtBytes(b)}` + (selN > 1 ? ` — ${selN.toLocaleString()} selected` : "");
  }
  const c = capParts(S.lib.device, S.lib.musicBytes, S.lib.videoBytes);
  const pctFree = c.total ? Math.round(c.free / c.total * 100) : 0;
  const tip = `${fmtBytes(c.free)} free of ${fmtBytes(c.total)} (${pctFree}% free) · Audio ${fmtBytes(c.audio)}${c.video ? ` · Video ${fmtBytes(c.video)}` : ""} · Other ${fmtBytes(c.other)}`;
  mc.title = tip;
  mc.innerHTML = `<div class="minibar" role="img" aria-label="${esc(tip)}"><i class="a" style="width:${c.pa}%"></i><i class="v" style="width:${c.pv}%"></i><i class="o" style="width:${c.po}%"></i></div>
    <span class="captext"><b>${esc(fmtBytes(c.free))}</b> free of ${esc(fmtBytes(c.total))}</span>`;
}
function renderAll(){ applyTheme(); renderSidebar(); renderMain(); renderLCD(); renderStats(); updateButtons(); }

/* ------------------------------------------------------------------ toolbar & keys */
$("#bOptions").onclick = () => openOptions();
$("#bFormats").onclick = () => { if (S.view !== "fm") setView("fm"); };
$("#bAdd").onclick = () => curPlaylist() ? openPlaylistPicker() : isVideoView() ? addVideos() : addSongs(); $("#bFolder").onclick = addFolder; $("#bInfo").onclick = openInfo; $("#bRemove").onclick = () => { const pl = curPlaylist(); if (pl && pl.editable) removeFromPlaylist(); else confirmRemove(); };
$("#bBrowse").onclick = () => { if (S.view === "fm"){ setView("music"); if (S.browser) return; } S.browser = !S.browser; store.set("browser", S.browser); S.bsel = {genre:null, artist:null, album:null}; S.listDirty = true; if (S.view === "summary") S.view = "music"; renderAll(); };
let searchT;
$("#search").addEventListener("input", e => {
  clearTimeout(searchT);
  $("#searchBox").classList.toggle("has", !!e.target.value);
  searchT = setTimeout(() => { S.search = e.target.value.trim(); S.listDirty = true; S.bsel = {genre:null, artist:null, album:null};
    if (S.view === "fm"){ fmBuildList(); fmRenderRows(true); return; }
    if (S.view === "summary") { S.view = "music"; renderAll(); } else { if (S.browser) renderBrowser(); const sc = $("#tscroll"); if (sc) sc.scrollTop = 0; renderRows(true); } }, 140);
});
$("#search").addEventListener("keydown", e => { if (e.key === "Escape"){ $("#search").value = ""; $("#search").dispatchEvent(new Event("input")); } if (e.key === "ArrowDown"){ const sc = $("#tscroll"); sc && sc.focus(); } });
$("#searchClear").onclick = e => { e.preventDefault(); $("#search").value = ""; $("#search").dispatchEvent(new Event("input")); $("#search").focus(); };
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  // block browser reload / navigation shortcuts, which would blank the app
  if (e.ctrlKey && !e.shiftKey && k === "n" && !sheetStack.length){ e.preventDefault(); newPlaylist(); return; }
  if (k === "f5" || (e.ctrlKey && ["r","p","n","t","w","u","g","j","h","l"].includes(k)) || (e.altKey && (k === "arrowleft" || k === "arrowright")) || k === "browserback"){ e.preventDefault(); return; }
  if (e.ctrlKey && (k === "=" || k === "+" || e.code === "NumpadAdd")){ e.preventDefault(); stepScale(1); return; }
  if (e.ctrlKey && (k === "-" || e.code === "NumpadSubtract")){ e.preventDefault(); stepScale(-1); return; }
  if (e.ctrlKey && (k === "0" || e.code === "Numpad0")){ e.preventDefault(); stepScale(0); return; }
  if (sheetStack.length) return;
  if (e.ctrlKey && k === ","){ e.preventDefault(); openOptions(); }
  if (e.ctrlKey && k === "f"){ e.preventDefault(); $("#search").focus(); $("#search").select(); }
  if (e.ctrlKey && k === "o"){ e.preventDefault(); const pl = curPlaylist(); pl ? (pl.editable && canWrite() && openPlaylistPicker()) : isVideoView() ? addVideos() : addSongs(); }
  if (e.ctrlKey && k === "i"){ e.preventDefault(); if (S.view !== "fm") openInfo(); }
  if (e.ctrlKey && k === "m"){ e.preventDefault(); if (S.view !== "fm") setView("fm"); }
  if (e.ctrlKey && k === "b"){ e.preventDefault(); $("#bBrowse").click(); }
  const typing = e.target.closest && e.target.closest("input,textarea,select,[contenteditable]");
  if (!typing && k === " " && !e.ctrlKey && !e.altKey){ e.preventDefault(); togglePlay(); }
  if (!typing && e.ctrlKey && k === "arrowright"){ e.preventDefault(); nextTrack(); }
  if (!typing && e.ctrlKey && k === "arrowleft"){ e.preventDefault(); prevTrack(); }
  if (!typing && e.ctrlKey && k === "arrowup"){ e.preventDefault(); setVolume(P.vol + .1); }
  if (!typing && e.ctrlKey && k === "arrowdown"){ e.preventDefault(); setVolume(P.vol - .1); }
});
addEventListener("contextmenu", e => { if (!e.target.closest("input,textarea")) e.preventDefault(); });
addEventListener("resize", () => renderRows(true));
let wheelAcc = 0;
addEventListener("wheel", e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) >= 100){ stepScale(wheelAcc < 0 ? 1 : -1); wheelAcc = 0; }
}, {passive:false});

/* ------------------------------------------------------------------ start */
async function start(){
  try { Object.assign(prefs, await api("prefs") || {}); } catch(e){}
  S.sort = store.get("sort", S.sort); S.browser = store.get("browser", false);
  const cw = store.get("colWidths", {}); S.widths = cw && typeof cw === "object" && !Array.isArray(cw) ? cw : {};
  S.hidden = new Set(store.get("hiddenCols", [])); S.theme = store.get("theme", "auto");
  setPlayerPos(store.get("playerPos", "top"));
  applyTextSize(+store.get("textSize", 1) || 1, false);
  const sc = +store.get("scale", 1) || 1;
  if (sc !== 1) applyScale(sc, true); else S.scale = 1;
  renderAll();
  try {
    S.devices = await api("devices");
    if (S.devices.length === 1) await openDevice(S.devices[0].root);
    else renderAll();
  } catch(e){ renderAll(); flash("Backend not available", e.message); }
}
start();
})();
</script>
