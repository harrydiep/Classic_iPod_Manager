<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PodManager</title>
<style>
:root{
  --fs:1;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --text:#1d1f22; --muted:#6b7480; --faint:#9aa2ad;
  --window:#f3f4f5;
  --alu-top:#eceef0; --alu-mid:#d6d9dd; --alu-bot:#c4c8cd; --alu-line:#9da3aa; --alu-hi:rgba(255,255,255,.75);
  --source:#dde3ea; --source-head:#7a8593; --source-sel-a:#6e9de0; --source-sel-b:#3f73c6;
  --list:#ffffff; --stripe:#eef3fa; --grid:#e3e7ec;
  --sel-a:#5d95e6; --sel-b:#2f69c6; --sel-text:#fff; --sel-dim:#c7d3e3;
  --head-a:#fbfbfc; --head-b:#e3e6ea; --head-line:#b9bec5;
  --lcd-glass:#f7fafd; --lcd-edge:#7c8691; --lcd-title-a:#eef2f7; --lcd-title-b:#c9d3de; --lcd-text:#20262d;
  --audio:#3d84db; --other:#e8a33a; --free:#ffffff;
  --btn-a:#fdfdfd; --btn-b:#dfe2e6; --btn-line:#8f959c;
  --danger:#c8372d;
  --sheet:#eceef1; --sheet-line:#a8aeb5;
  --focus:#3b7fe0;
  --shadow:0 18px 50px rgba(20,30,45,.35),0 2px 6px rgba(20,30,45,.25);
}
:root[data-theme="black"]{
  --text:#e9eaec; --muted:#9aa1ab; --faint:#6f7680;
  --window:#1f2023;
  --alu-top:#4a4c51; --alu-mid:#323438; --alu-bot:#26272a; --alu-line:#111214; --alu-hi:rgba(255,255,255,.12);
  --source:#2a2c30; --source-head:#8a929d;
  --list:#1c1d20; --stripe:#232529; --grid:#2e3035;
  --sel-dim:#3b4350;
  --head-a:#3a3c41; --head-b:#2b2d31; --head-line:#141517;
  --btn-a:#55585e; --btn-b:#38393d; --btn-line:#121315;
  --sheet:#2b2d31; --sheet-line:#121315;
  --free:#3a3d42;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:calc(13px*var(--fs))/1.35 var(--font);color:var(--text);background:var(--window);overflow:hidden;user-select:none;-webkit-user-select:none}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea{user-select:text;-webkit-user-select:text}
button{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}

/* ---------- toolbar (brushed aluminium) ---------- */
.toolbar{display:grid;grid-template-columns:auto 1fr minmax(calc(320px*var(--fs)),calc(460px*var(--fs))) 1fr auto;align-items:center;gap:14px;padding:9px 14px 10px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,.025) 1px 2px,transparent 2px 4px),
    linear-gradient(var(--alu-top),var(--alu-mid) 55%,var(--alu-bot));
  border-bottom:1px solid var(--alu-line);box-shadow:inset 0 1px 0 var(--alu-hi)}
.tgroup{display:flex;gap:6px;align-items:center}
.tgroup.right{justify-content:flex-end}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0 2px;min-width:52px;color:var(--text);font-size:11px;white-space:nowrap}
.tbtn .cap{width:36px;height:26px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(var(--btn-a),var(--btn-b));border:1px solid var(--btn-line);box-shadow:inset 0 1px 0 var(--alu-hi),0 1px 0 rgba(255,255,255,.35)}
.tbtn:active .cap,.tbtn.on .cap{background:linear-gradient(var(--btn-b),var(--btn-a));box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.tbtn:disabled{opacity:.42}
.tbtn svg{width:16px;height:16px}
.spacer{width:10px}

/* LCD: the one bright, memorable element */
.lcd{grid-column:3;height:calc(52px*var(--fs));border-radius:7px;padding:2px;background:linear-gradient(#8e98a3,#b9c1ca);box-shadow:inset 0 1px 2px rgba(0,0,0,.45),0 1px 0 var(--alu-hi)}
.lcd-in{height:100%;border-radius:5px;background:var(--lcd-glass);color:var(--lcd-text);overflow:hidden;position:relative;display:grid;grid-template-rows:calc(15px*var(--fs)) 1fr}
.lcd-in::after{content:"";position:absolute;inset:0;background:linear-gradient(170deg,rgba(255,255,255,.35) 0 38%,transparent 39%);pointer-events:none}
#lcdTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;margin-right:8px}
.lcd-title{display:flex;align-items:center;justify-content:space-between;padding:0 7px;font-size:calc(10.5px*var(--fs));font-weight:600;
  background:linear-gradient(var(--lcd-title-a),var(--lcd-title-b));border-bottom:1px solid #a9b4c0}
.batt{width:19px;height:8px;border:1px solid #5d6670;border-radius:2px;position:relative;padding:1px}
.batt::after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:#5d6670;border-radius:0 1px 1px 0}
.batt i{display:block;height:100%;background:linear-gradient(#9ee08a,#4cad3a);border-radius:1px;transition:width .3s}
.battbox{display:flex;align-items:center;gap:3px;flex:none;padding:2px 5px 2px 4px;margin:-2px -5px -2px 0;border-radius:4px;position:relative;z-index:2;outline:none;cursor:default}
.battbox:hover,.battbox:focus-visible{background:rgba(0,0,0,.09)}
.battbox .bolt{width:6px;height:9px;display:none;color:var(--lcd-text)}
.battbox.charging .bolt{display:block}
.battbox.low .batt i,.bp-big.low i{background:linear-gradient(#f5a197,#d9443a)}
.battbox.unknown .batt{opacity:.45}
.battbox.unknown .batt i{width:0!important}
.battpop{position:fixed;z-index:65;width:calc(232px*var(--fs));padding:12px 14px 11px;background:var(--sheet);color:var(--text);border:1px solid var(--sheet-line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.28);font-size:calc(12px*var(--fs));pointer-events:none;animation:bpop .12s ease-out}
.battpop::before{content:"";position:absolute;top:-6px;left:var(--ax,50%);width:10px;height:10px;margin-left:-5px;background:var(--sheet);border-left:1px solid var(--sheet-line);border-top:1px solid var(--sheet-line);transform:rotate(45deg)}
@keyframes bpop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.bp-row{display:flex;align-items:center;gap:13px}
.bp-big{flex:none;width:calc(48px*var(--fs));height:calc(23px*var(--fs));border:2px solid var(--muted);border-radius:5px;padding:2px;position:relative;display:flex}
.bp-big::after{content:"";position:absolute;right:-5px;top:30%;bottom:30%;width:3px;background:var(--muted);border-radius:0 2px 2px 0}
.bp-big i{display:block;height:100%;border-radius:2px;background:linear-gradient(#9ee08a,#4cad3a)}
.bp-big svg{position:absolute;left:50%;top:50%;width:calc(10px*var(--fs));height:calc(14px*var(--fs));transform:translate(-50%,-50%);color:var(--text);filter:drop-shadow(0 0 1.5px var(--sheet)) drop-shadow(0 0 1px var(--sheet))}
.bp-big.unknown{opacity:.45}
.bp-pct{font-size:calc(21px*var(--fs));font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.bp-state{color:var(--muted);margin-top:1px}
.bp-state b{color:var(--text);font-weight:600}
.bp-note{margin-top:9px;padding-top:8px;border-top:1px solid var(--grid);color:var(--muted);font-size:calc(11px*var(--fs));line-height:1.35}
@media (prefers-reduced-motion:reduce){.battpop{animation:none}.batt i{transition:none}}
.lcd-body{display:flex;flex-direction:column;justify-content:center;padding:0 10px;min-width:0}
.lcd-line1{font-weight:600;font-size:calc(12.5px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.lcd-line2{font-size:calc(11px*var(--fs));color:#56606b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.lcd-progress{display:flex;align-items:center;gap:7px;margin-top:3px}
.pbar{flex:1;height:8px;border-radius:4px;border:1px solid #7c8a99;background:#fff;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(#8fbaf0,#3d79d4 60%,#2f63b8);transition:width .25s}
.pbar.indet i{width:35%!important;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.lcd-x{border:0;background:none;width:16px;height:16px;padding:0;color:#56606b;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1}
.lcd-x:hover{background:#d9dfe6}

.search{display:flex;align-items:center;gap:5px;height:calc(24px*var(--fs));width:calc(190px*var(--fs));border-radius:12px;padding:0 9px;background:#fff;border:1px solid var(--btn-line);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.search input{border:0;outline:0;background:none;width:100%;font-size:calc(12px*var(--fs));color:#1d1f22}
.search svg{width:12px;height:12px;color:#7a828c;flex:none}
.search .clear{border:0;background:#aab1b9;color:#fff;width:13px;height:13px;border-radius:50%;font-size:calc(9px*var(--fs));line-height:13px;padding:0;display:none}
.search.has .clear{display:block}

/* ---------- body ---------- */
.body{display:grid;grid-template-columns:calc(var(--sidebar,212px)*var(--fs)) 1fr;min-height:0}
.sidebar{background:var(--source);border-right:1px solid var(--alu-line);overflow:auto;padding:8px 0 16px}
.shead{font-size:calc(11px*var(--fs));font-weight:700;color:var(--source-head);padding:10px 12px 3px}
.sitem{display:flex;align-items:center;gap:7px;height:calc(24px*var(--fs));padding:0 8px 0 18px;font-size:calc(12.5px*var(--fs));white-space:nowrap}
.sitem .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.sitem .cnt{font-size:calc(10.5px*var(--fs));color:var(--muted)}
.sitem svg{width:15px;height:15px;flex:none;color:var(--muted)}
.sitem.sel{background:linear-gradient(var(--source-sel-a),var(--source-sel-b));color:#fff;font-weight:600}
.sitem.sel svg,.sitem.sel .cnt{color:#e6efff}
.sitem.child{padding-left:34px}
.eject{border:0;background:none;padding:2px;border-radius:4px;display:grid;place-items:center;color:inherit}
.eject:hover{background:rgba(0,0,0,.1)}
.sitem.sel .eject:hover{background:rgba(255,255,255,.2)}
.sitem input{flex:1;font-size:calc(12.5px*var(--fs));padding:1px 4px;border:1px solid var(--focus);border-radius:3px;background:#fff;color:#1d1f22}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--list)}
.banner{padding:7px 14px;background:#fff6dc;color:#5d4a10;border-bottom:1px solid #e6d18c;font-size:calc(12px*var(--fs))}
:root[data-dark] .banner{background:#3d3520;color:#f3e3b0;border-color:#57492a}

/* column browser */
.browser{display:grid;grid-template-columns:repeat(3,1fr);height:calc(170px*var(--fs));border-bottom:1px solid var(--head-line);flex:none}
.bcol{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--grid)}
.bcol:last-child{border-right:0}
.bcol .bh{height:calc(21px*var(--fs));line-height:calc(20px*var(--fs));padding:0 8px;font-size:calc(11.5px*var(--fs));background:linear-gradient(var(--head-a),var(--head-b));border-bottom:1px solid var(--head-line)}
.bcol .bl{flex:1;overflow:auto;outline:none}
.bcol .bi{height:calc(19px*var(--fs));line-height:calc(19px*var(--fs));padding:0 8px;font-size:calc(12px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcol .bi.sel{background:var(--sel-dim)}
.bcol .bl:focus .bi.sel{background:linear-gradient(var(--sel-a),var(--sel-b));color:#fff}

/* song table */
.table{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.theadwrap{overflow:hidden;flex:none}
.thead{min-width:var(--tablemin,0);display:grid;grid-template-columns:var(--cols);height:calc(21px*var(--fs));flex:none;background:linear-gradient(var(--head-a),var(--head-b));border-bottom:1px solid var(--head-line);font-size:calc(11.5px*var(--fs));padding-right:var(--sbw,0px)}
.th{position:relative;padding:0 6px;line-height:calc(20px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--grid)}
.th.sorted{background:linear-gradient(#cfe0f6,#a9c4ea);color:#10233d}
:root[data-dark] .th.sorted{background:linear-gradient(#41618c,#2d4a73);color:#fff}
.th .arrow{font-size:calc(8px*var(--fs));margin-left:4px;opacity:.8}
.th .grip{position:absolute;right:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:2}
.th.r,.td.r{text-align:right}
.tscroll{flex:1;overflow:auto;position:relative;outline:none}
.tspacer{position:relative;min-width:var(--tablemin,0)}
.row{position:absolute;left:0;right:0;height:var(--row,20px);display:grid;grid-template-columns:var(--cols);font-size:calc(12px*var(--fs));line-height:var(--row,20px)}
.row.odd{background:var(--stripe)}
.row.even{background:transparent}
.td{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.sel{background:var(--sel-dim)}
.tscroll:focus .row.sel{background:linear-gradient(var(--sel-a),var(--sel-b));color:var(--sel-text)}
.tscroll:focus .row.sel .td.m{color:#dde8fb}
.td.m{color:var(--muted)}
.stars{letter-spacing:1px;font-size:calc(11px*var(--fs));color:var(--faint)}
.stars b{font-weight:400;color:var(--text)}
.tscroll:focus .row.sel .stars,.tscroll:focus .row.sel .stars b{color:#fff}
.stars span{cursor:pointer}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:30px;pointer-events:none}
.empty p{margin:4px 0}
.empty .big{font-size:calc(15px*var(--fs));color:var(--text);font-weight:600}

/* summary page */
.summary{flex:1;overflow:auto;padding:28px 32px}
.sum-grid{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:34px;max-width:980px}
.screen{align-self:start;border-radius:10px;padding:4px;background:linear-gradient(#7e8893,#aab2bb);box-shadow:0 1px 0 rgba(255,255,255,.6),inset 0 1px 3px rgba(0,0,0,.4)}
.screen-in{border-radius:7px;background:var(--lcd-glass);color:var(--lcd-text);overflow:hidden;position:relative}
.screen-in::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28) 0 30%,transparent 31%);pointer-events:none}
.screen .lcd-title{height:calc(20px*var(--fs));font-size:calc(12px*var(--fs))}
.menu-row{display:flex;justify-content:space-between;align-items:center;height:calc(25px*var(--fs));padding:0 10px;font-size:calc(13px*var(--fs));border-bottom:1px solid #edf1f5}
.menu-row .v{color:#5a6570;font-size:calc(12px*var(--fs))}
.menu-row.hl{background:linear-gradient(#78aaeb,#3a76d0 55%,#2c63bb);color:#fff;border-color:#2c63bb}
.menu-row.hl .v{color:#e3eeff}
.sum-name{font-size:calc(24px*var(--fs));font-weight:600;margin:0 0 2px;letter-spacing:-.2px}
.sum-sub{color:var(--muted);margin:0 0 22px}
.capbar{display:flex;height:22px;border-radius:11px;overflow:hidden;border:1px solid #8b939c;background:var(--free);box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.capbar i{display:block;height:100%}
.capbar .a{background:linear-gradient(#8bb8ef,var(--audio) 55%,#2c68b8)}
.capbar .o{background:linear-gradient(#f6cd85,var(--other) 55%,#c98418)}
.legend{display:flex;gap:22px;margin-top:9px;font-size:calc(12px*var(--fs));color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.2)}
.legend b{color:var(--text);font-weight:600}
.sum-actions{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.notes{margin-top:26px;color:var(--muted);font-size:calc(12px*var(--fs));max-width:560px}
.notes p{margin:0 0 8px}

/* welcome / setup */
.welcome{flex:1;display:grid;place-items:center;padding:30px;overflow:auto}
.welcome-card{max-width:520px;display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:center}
.welcome h1{font-size:calc(22px*var(--fs));font-weight:600;margin:0 0 8px;letter-spacing:-.2px}
.welcome p{color:var(--muted);margin:0 0 10px}
.welcome .screen{width:200px}

/* buttons */
.btn{height:calc(26px*var(--fs));padding:0 16px;border-radius:13px;border:1px solid var(--btn-line);background:linear-gradient(var(--btn-a),var(--btn-b));box-shadow:inset 0 1px 0 var(--alu-hi);font-size:calc(12.5px*var(--fs));white-space:nowrap}
.btn:active{background:linear-gradient(var(--btn-b),var(--btn-a))}
.btn.primary{border-color:#2457a6;color:#fff;background:linear-gradient(#80b1f0,#3f7fd8 50%,#2e67c0);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.btn.primary:active{background:linear-gradient(#2e67c0,#5a95e4)}
.btn.danger{border-color:#8e231b;color:#fff;background:linear-gradient(#ef8a7f,#d24a3d 50%,#b5362a)}
.btn:disabled{opacity:.5}

/* footer */
.footer{display:grid;grid-template-columns:minmax(calc(var(--sidebar,212px)*var(--fs)),max-content) 1fr minmax(calc(var(--sidebar,212px)*var(--fs)),max-content);align-items:center;height:calc(30px*var(--fs));border-top:1px solid var(--alu-line);
  background:linear-gradient(var(--alu-top),var(--alu-bot));box-shadow:inset 0 1px 0 var(--alu-hi);font-size:calc(11.5px*var(--fs))}
.footer .stats{text-align:center;color:var(--text)}
.footer .mini{display:flex;align-items:center;gap:8px;padding:0 12px;white-space:nowrap}
.captext b{font-weight:600}
.minibar{flex:1;min-width:48px;max-width:140px;height:9px;border-radius:5px;overflow:hidden;display:flex;background:var(--free);border:1px solid #8b939c}
.minibar i{display:block;height:100%}
.minibar .a{background:var(--audio)}.minibar .o{background:var(--other)}
.seg{display:flex;border:1px solid var(--btn-line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:linear-gradient(var(--btn-a),var(--btn-b));font-size:calc(10.5px*var(--fs));padding:1px 9px}
.seg button.on{background:linear-gradient(#5b8fd9,#2f64ba);color:#fff}

/* get info header with artwork */
.info-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px 20px 12px;border-bottom:1px solid var(--sheet-line);margin-bottom:10px}
.art{width:132px;height:132px;border-radius:6px;overflow:hidden;position:relative;display:grid;place-items:center;
  background:linear-gradient(145deg,#fafbfc,#d9dee4);border:1px solid #a9b0b8;box-shadow:0 2px 6px rgba(0,0,0,.18);color:#9aa3ad}
:root[data-dark] .art{background:linear-gradient(145deg,#4a4d53,#2c2e32);border-color:#151618;color:#7b828c}
.art svg{width:44px;height:44px}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.art .none{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:calc(11px*var(--fs))}
.art.stack{box-shadow:4px 4px 0 -1px var(--sheet),4px 4px 0 0 #a9b0b8,0 2px 6px rgba(0,0,0,.18)}
.info-titles{min-width:0}
.info-titles div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it1{font-size:calc(17px*var(--fs));font-weight:600;line-height:1.25}
.it2,.it3{font-size:calc(13px*var(--fs));color:var(--muted)}
.it4{font-size:calc(11.5px*var(--fs));color:var(--faint);margin-top:6px}
.it5{margin-top:1px}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(15,18,22,.78);display:grid;place-items:center;cursor:zoom-out}
.lightbox img{max-width:86vw;max-height:84vh;box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:4px}
.lightbox p{color:#d5dae0;font-size:calc(12px*var(--fs));text-align:center;margin:10px 0 0}

/* options */
.opt-sec{font-size:calc(12px*var(--fs));font-weight:700;color:var(--muted);margin:14px 0 8px}
.opt-sec:first-child{margin-top:4px}
.opt-row{display:grid;grid-template-columns:calc(118px*var(--fs)) 1fr;gap:6px 12px;align-items:center;margin-bottom:10px}
.opt-row .k{text-align:right;color:var(--muted);font-size:calc(12px*var(--fs))}
.opt-hint{grid-column:2;font-size:calc(11.5px*var(--fs));color:var(--faint);margin-top:-2px}
.scale{display:flex;align-items:center;gap:8px}
.scale input[type=range]{flex:1;accent-color:#3a76d0;min-width:120px}
.scale .pct{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.stepb{width:24px;height:24px;border-radius:12px;border:1px solid var(--btn-line);background:linear-gradient(var(--btn-a),var(--btn-b));padding:0;line-height:20px;font-size:calc(15px*var(--fs))}
.seg.big{display:inline-flex;margin:0;border-radius:12px}
.seg.big button{font-size:calc(12px*var(--fs));padding:3px 14px}

/* sheets / dialogs */
.veil{position:fixed;inset:0;background:rgba(30,36,44,.32);display:flex;justify-content:center;align-items:flex-start;z-index:50}
.sheet{margin-top:0;width:min(calc(580px*var(--fs)),94vw);max-height:94vh;display:flex;flex-direction:column;overflow:hidden;background:var(--sheet);border:1px solid var(--sheet-line);border-top:0;border-radius:0 0 9px 9px;box-shadow:var(--shadow);animation:drop .18s ease-out}

.sheet-b{padding:6px 20px 8px;overflow:auto;flex:1 1 auto;min-height:0}
.sheet-h,.sheet-f,.info-head{flex:none}
.sheet-b p{margin:0 0 10px}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 20px 16px}

.form{display:grid;grid-template-columns:calc(92px*var(--fs)) 1fr;gap:7px 10px;align-items:center}

.form textarea{height:calc(52px*var(--fs));resize:vertical}
.form input.short{width:calc(64px*var(--fs))}
.form .of{color:var(--muted);font-size:calc(12px*var(--fs))}
.form input[type=checkbox].pick{flex:none;margin:0}
.form .mixed::placeholder{color:#9aa2ab;font-style:italic}
.rating-edit{display:flex;gap:2px;font-size:calc(17px*var(--fs));color:#9aa2ab}
.rating-edit span{cursor:pointer;width:18px;text-align:center}
.rating-edit span.on{color:var(--text)}
.rating-edit .x{font-size:calc(12px*var(--fs));width:auto;margin-left:6px;color:var(--muted)}
.check{display:flex;align-items:center;gap:7px;font-size:calc(12px*var(--fs))}
.errlist{max-height:240px;overflow:auto;background:var(--list);border:1px solid var(--grid);border-radius:5px;font-size:calc(12px*var(--fs))}
.errlist div{padding:5px 9px;border-bottom:1px solid var(--grid)}
.errlist b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.errlist span{color:var(--muted)}
.fileinfo{font-size:calc(11.5px*var(--fs));color:var(--muted);margin:6px 0 2px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}

/* context menu */
.ctx{position:fixed;z-index:60;min-width:190px;padding:4px 0;background:rgba(246,247,249,.97);border:1px solid #9aa1aa;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:calc(12.5px*var(--fs));color:#1d1f22}
.ctx div{padding:3px 18px}

.ctx div:hover{background:linear-gradient(var(--sel-a),var(--sel-b));color:#fff}
.ctx hr{border:0;border-top:1px solid #d5d9de;margin:4px 0}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::-webkit-scrollbar{width:13px;height:13px}
::-webkit-scrollbar-track{background:var(--list)}
::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#c9ced4,#aeb5bd);border-radius:7px;border:3px solid var(--list)}
:root[data-dark] ::-webkit-scrollbar-thumb{background:#4b4e54;border-color:var(--list)}
@media (max-width:1000px){.toolbar{grid-template-columns:auto 0 1fr 0 auto}.tbtn .t{display:none}.tbtn{min-width:40px}.search{width:140px}}
@media (max-width:780px){:root{--sidebar:156px}.toolbar{gap:8px;padding:7px 8px}.tgroup{gap:2px}.tbtn{min-width:34px}.spacer{width:2px}.search{width:104px}.lcd{min-width:0}.footer .stats{font-size:calc(10.5px*var(--fs))}}
@media (max-width:600px){.search{width:84px}.lcd-line2{display:none}.tbtn .cap{width:30px}}

/* drag & drop */
.dropzone{position:fixed;inset:0;z-index:40;pointer-events:none;display:none}
.dropzone.on{display:block}
.dropzone .panel{position:absolute;top:calc(78px*var(--fs));right:18px;bottom:calc(44px*var(--fs));left:calc(var(--sidebar,212px)*var(--fs) + 18px);
  border:3px dashed #3d7fd8;border-radius:14px;background:rgba(61,127,216,.10);display:grid;place-items:center;text-align:center}
.dropzone .panel div{background:var(--sheet);border:1px solid var(--sheet-line);border-radius:10px;padding:16px 26px;box-shadow:var(--shadow);max-width:80%}
.dropzone .panel b{display:block;font-size:calc(16px*var(--fs));margin-bottom:2px}
.dropzone .panel span{color:var(--muted);font-size:calc(12.5px*var(--fs))}
.dropzone.deny .panel{border-color:var(--danger);background:rgba(200,55,45,.10)}
.dropzone.deny .panel b{color:var(--danger)}
.seg.sizes button{padding:3px 11px}

/* ---------- modern themes: flat surfaces, rounded controls, one accent colour ---------- */

<script>
"use strict";
(function(){
/* ------------------------------------------------------------------ helpers */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = (m, ...a) => window.podCall ? window.podCall(m, ...a) : Promise.reject(new Error("PodManager backend not available"));
// Settings live in the backend (the page is loaded from memory, so browser
// storage isn't dependable). They are fetched once before start-up.
const prefs = {};
const store = {
  get(k, d){ return k in prefs ? prefs[k] : d; },
  set(k, v){ prefs[k] = v; api("setPref", k, v).catch(() => {}); }
};
function fmtTime(ms){ ms = ms||0; const s = Math.round(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}` : `${m}:${String(ss).padStart(2,"0")}`; }
function fmtBytes(b){ b = b||0; if (b >= 1e9) return (b/1e9).toFixed(b >= 1e10 ? 1 : 2)+" GB"; if (b >= 1e6) return (b/1e6).toFixed(1)+" MB"; if (b >= 1e3) return Math.round(b/1e3)+" KB"; return b+" bytes"; }
function fmtTotal(ms){ const h = ms/3.6e6; if (h >= 48) return (h/24).toFixed(1)+" days"; if (h >= 1) return h.toFixed(1)+" hours"; return Math.round(ms/60000)+" minutes"; }
const plural = (n, w, p) => `${n.toLocaleString()} ${n === 1 ? w : (p || w+"s")}`;
const sortKey = s => (s||"").toLowerCase().replace(/^the\s+/, "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");

/* ------------------------------------------------------------------ state */
// Every song-list column. text() is the plain value (used for sizing a
// column to fit); html() overrides how it is drawn.
const COLS = [
  {key:"trackNumber", label:"#", w:34, r:true, m:true, text:t => t.trackNumber ? String(t.trackNumber) : ""},
  {key:"title", label:"Name", w:200, text:t => t.title || ""},
  {key:"lengthMs", label:"Time", w:48, r:true, text:t => fmtTime(t.lengthMs)},
  {key:"artist", label:"Artist", w:140, text:t => t.artist || ""},
  {key:"album", label:"Album", w:150, text:t => t.album || ""},
  {key:"genre", label:"Genre", w:84, text:t => t.genre || ""},
  {key:"year", label:"Year", w:44, r:true, text:t => t.year ? String(t.year) : ""},
  {key:"type", label:"Type", w:56, text:t => fileType(t), tip:t => t.kind || ""},
  {key:"bitrate", label:"Bit Rate", w:66, r:true, text:t => t.bitrate ? `${t.bitrate} kbps` : ""},
  {key:"size", label:"Size", w:62, r:true, text:t => t.size ? fmtBytes(t.size) : ""},
  {key:"dateAdded", label:"Date Added", w:86, r:true, text:t => fmtDate(t.dateAdded), tip:t => t.dateAdded ? new Date(t.dateAdded*1000).toLocaleString() : ""},
  {key:"rating", label:"Rating", w:70, text:t => "", html:t => stars(t.rating, t.id)},
  {key:"plays", label:"Plays", w:44, r:true, text:t => t.plays ? String(t.plays) : ""},
];
const COL_BY_KEY = Object.fromEntries(COLS.map(c => [c.key, c]));
const KIND_SHORT = {"MPEG audio file":"MP3", "AAC audio file":"AAC", "Apple Lossless audio file":"ALAC", "WAV audio file":"WAV",
  "AIFF audio file":"AIFF", "AAC audio book file":"AAC book", "Protected AAC audio file":"AAC (DRM)", "Purchased AAC audio file":"AAC"};
function fileType(t){
  if (KIND_SHORT[t.kind]) return KIND_SHORT[t.kind];
  const ext = (t.path || "").split(".").pop();
  return ext && ext !== t.path ? ext.toUpperCase() : (t.kind || "");
}
function fmtDate(sec){
  return sec ? new Date(sec*1000).toLocaleDateString(undefined, {day:"2-digit", month:"2-digit", year:"numeric"}) : "";
}
function colWidth(c){ const w = +S.widths[c.key]; return w > 0 ? w : c.w; }
function visibleCols(){ return COLS.filter(c => c.key === "title" || !S.hidden.has(c.key)); }
const S = {
  devices: [], lib: null, byId: new Map(), setupRoot: null,
  view: "music",            // summary | music | pl:<index> | setup | none
  sel: new Set(), anchor: null, cursor: null,
  sort: store.get("sort", {key:"artist", dir:1}),
  search: "", browser: store.get("browser", false), bsel: {genre:null, artist:null, album:null},
  widths: {}, hidden: new Set(),
  theme: store.get("theme", "auto"), scale: 1,
  busy: null, flash: null, batt: null, list: [], listDirty: true, renaming: false,
};
let ROW = 20;
const TEXT_SIZES = [[0.9, "Small"], [1, "Medium"], [1.15, "Large"], [1.3, "Larger"], [1.5, "Largest"]];
let textScale = 1;
function applyTextSize(fs, save){
  textScale = TEXT_SIZES.some(t => t[0] === fs) ? fs : 1;
  ROW = Math.round(20 * textScale);
  const root = document.documentElement.style;
  root.setProperty("--fs", String(textScale));
  root.setProperty("--row", ROW + "px");
  if (save) store.set("textSize", textScale);
  applyWidths();
  renderRows(true);
}

/* ------------------------------------------------------------------ theme */
// sw: swatch colours for the picker (toolbar, sidebar, list, accent, lines)
const THEMES = [
  {v:"auto",   l:"Auto",       sw:["linear-gradient(#eceef0,#c4c8cd)", "#dde3ea", "#fff", "#3f73c6", "#dfe3e8"]},
  {v:"silver", l:"Silver",     sw:["linear-gradient(#eceef0,#c4c8cd)", "#dde3ea", "#fff", "#3f73c6", "#dfe3e8"]},
  {v:"black",  l:"Black",      sw:["linear-gradient(#4a4c51,#26272a)", "#2a2c30", "#1c1d20", "#3f73c6", "#34363b"], dark:true},
  {v:"blue",   l:"Dark Blue",  sw:["#11233f", "#0f1f38", "#0b172b", "#3d8bff", "#1d3358"], dark:true, modern:true},
  {v:"space",  l:"Space Grey", sw:["#2c2c2e", "#242426", "#1c1c1e", "#0a84ff", "#38383a"], dark:true, modern:true},
  {v:"white",  l:"White",      sw:["#ffffff", "#f5f5f7", "#ffffff", "#0071e3", "#ececf0"], modern:true},
  {v:"red",    l:"Red",        sw:["#c4122f", "#fbf5f6", "#ffffff", "#d0142f", "#f3e6e8"], modern:true},
];
function applyTheme(){
  let t = S.theme;
  if (t === "auto") t = (S.lib && S.lib.device.model.color === "black") ? "black" : "silver";
  if (!THEMES.some(x => x.v === t)) t = "silver";
  const th = THEMES.find(x => x.v === t), root = document.documentElement;
  root.dataset.theme = t;
  root.toggleAttribute("data-modern", !!th.modern);
  root.toggleAttribute("data-dark", !!th.dark);
  root.style.colorScheme = th.dark ? "dark" : "light";
}

/* ------------------------------------------------------------------ interface size */
const SCALES = [0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2];
let cssZoom = 1;      // only used when the window can't zoom natively (dev mode)
let scaleTimer;
function applyScale(sc, immediate){
  S.scale = sc;
  clearTimeout(scaleTimer);
  const go = async () => {
    let native = false;
    try { native = await api("setScale", sc); } catch(e){}
    cssZoom = native ? 1 : sc;
    document.documentElement.style.zoom = native ? "" : String(sc);
    prefs.scale = sc;
    renderRows(true);
  };
  immediate ? go() : (scaleTimer = setTimeout(go, 90));
}
function stepScale(dir){
  let i = SCALES.findIndex(v => Math.abs(v - S.scale) < 0.001);
  if (i < 0) i = SCALES.indexOf(1);
  const ni = dir === 0 ? SCALES.indexOf(1) : Math.max(0, Math.min(SCALES.length-1, i + dir));
  applyScale(SCALES[ni], true);
  flash("Interface size " + Math.round(SCALES[ni]*100) + "%", "");
  const o = $("#optScale"); if (o) syncScaleUI();
}
function syncScaleUI(){
  const i = SCALES.findIndex(v => Math.abs(v - S.scale) < 0.001);
  const r = $("#optScale"); if (!r) return;
  r.value = i < 0 ? SCALES.indexOf(1) : i;
  $("#optPct").textContent = Math.round(S.scale*100) + "%";
}

/* ------------------------------------------------------------------ options */
function openOptions(){
  if (sheetStack.length) return;
  const themeBtn = th => `<button data-theme="${th.v}" class="${S.theme === th.v ? "on" : ""}" aria-pressed="${S.theme === th.v}" ${th.v === "auto" ? `title="Match the connected iPod’s colour"` : ""}>
      <span class="sw ${th.v === "auto" ? "auto" : ""}" aria-hidden="true" style="--sw-tb:${th.sw[0]};--sw-side:${th.sw[1]};--sw-list:${th.sw[2]};--sw-acc:${th.sw[3]};--sw-line:${th.sw[4]}"><span class="t"></span><span class="s"></span><span class="l"></span></span>${th.l}</button>`;
  sheet(`<div class="sheet-h">Options</div><div class="sheet-b">
      <div class="opt-sec">Interface</div>
      <div class="opt-row"><span class="k" style="align-self:start;margin-top:calc(19px*var(--fs))">Theme</span>
        <div class="themes" role="group" aria-label="Theme"><div class="grp">Classic</div>${THEMES.filter(t => !t.modern).map(themeBtn).join("")}<div class="grp">Modern</div>${THEMES.filter(t => t.modern).map(themeBtn).join("")}</div>
        <div class="opt-hint">Auto follows the colour of the connected iPod. The modern themes use flatter, simpler styling.</div></div>
      <div class="opt-row"><label class="k" for="optScale">Interface size</label>
        <div class="scale"><button class="stepb" data-step="-1" aria-label="Smaller">−</button>
          <input type="range" id="optScale" min="0" max="${SCALES.length-1}" step="1" aria-valuetext="${Math.round(S.scale*100)}%">
          <button class="stepb" data-step="1" aria-label="Larger">+</button><span class="pct" id="optPct"></span></div>
        <div class="opt-hint">Scales everything, on top of Windows display scaling. Shortcuts: Ctrl + plus, Ctrl + minus, Ctrl + 0.</div></div>
      <div class="opt-row"><span class="k">Text size</span>
        <div><div class="seg big sizes" role="group" aria-label="Text size">${TEXT_SIZES.map(([v, l]) => `<button data-fs="${v}" class="${v === textScale ? "on" : ""}" style="font-size:${(12*v).toFixed(1)}px">${l}</button>`).join("")}</div></div>
        <div class="opt-hint">Changes only the text in lists, menus and dialogs. Buttons and icons stay the same size.</div></div>
      <div class="opt-sec">Editing</div>
      <div class="opt-row"><span></span>
        <label class="check"><input type="checkbox" id="optWrite" ${store.get("writeTags", true) ? "checked" : ""}>Update song files when editing info</label>
        <div class="opt-hint">Writes changes into the songs' own tags as well as the iPod's library, so they show up in other players too.</div></div>
    </div>
    <div class="sheet-f"><div class="left"><button class="btn" data-reset>Restore Defaults</button></div><button class="btn primary" data-ok>Done</button></div>`,
  (v, close) => {
    syncScaleUI();
    const r = v.querySelector("#optScale");
    r.addEventListener("input", () => { const sc = SCALES[+r.value]; S.scale = sc; $("#optPct").textContent = Math.round(sc*100) + "%"; r.setAttribute("aria-valuetext", Math.round(sc*100) + "%"); applyScale(sc); });
    v.querySelectorAll("[data-step]").forEach(b => b.onclick = () => stepScale(+b.dataset.step));
    v.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => {
      S.theme = b.dataset.theme; store.set("theme", S.theme); applyTheme();
      v.querySelectorAll("[data-theme]").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); });
    });
    v.querySelector("#optWrite").onchange = e => store.set("writeTags", e.target.checked);
    const paintSizes = () => v.querySelectorAll("[data-fs]").forEach(x => x.classList.toggle("on", +x.dataset.fs === textScale));
    v.querySelectorAll("[data-fs]").forEach(b => b.onclick = () => { applyTextSize(+b.dataset.fs, true); paintSizes(); });
    v.querySelector("[data-reset]").onclick = () => {
      S.theme = "auto"; store.set("theme", "auto"); applyTheme();
      v.querySelectorAll("[data-theme]").forEach(x => { x.classList.toggle("on", x.dataset.theme === "auto"); x.setAttribute("aria-pressed", x.dataset.theme === "auto"); });
      applyScale(1, true); S.scale = 1; syncScaleUI();
      store.set("writeTags", true); v.querySelector("#optWrite").checked = true;
      S.widths = {}; store.set("colWidths", {}); S.hidden = new Set(); store.set("hiddenCols", []); renderMain();
      applyTextSize(1, true); paintSizes();
    };
    v.querySelector("[data-ok]").onclick = close;
  });
}

/* ------------------------------------------------------------------ LCD */
function renderLCD(){
  const body = $("#lcdBody");
  const lib = S.lib;
  $("#lcdTitle").textContent = S.busy && S.busy.label ? S.busy.label : lib ? lib.device.name : "PodManager";
  paintBattery();
  if (S.busy){
    const b = S.busy, pct = b.total ? Math.round(b.done / b.total * 100) : 0;
    const verb = {add:"Copying", remove:"Removing", update:"Updating", export:"Copying to computer"}[b.job] || "Working";
    const line1 = b.total ? `${verb} ${Math.min(b.done+1, b.total).toLocaleString()} of ${b.total.toLocaleString()}` : verb+"…";
    body.innerHTML = `<div class="lcd-line1">${esc(line1)}</div>
      <div class="lcd-progress"><div class="pbar ${b.total ? "" : "indet"}"><i style="width:${pct}%"></i></div>
      <button class="lcd-x" id="lcdCancel" title="Stop after the current song" aria-label="Stop"><svg width="9" height="9"><use href="#i-x"/></svg></button></div>`;
    body.title = b.label || "";
    $("#lcdCancel").onclick = () => api("cancel");
    return;
  }
  if (S.flash){ body.innerHTML = `<div class="lcd-line1">${esc(S.flash.a)}</div><div class="lcd-line2">${esc(S.flash.b||"")}</div>`; return; }
  if (!lib){
    const l1 = S.view === "setup" ? "New iPod" : S.devices.length ? "Select your iPod" : "No iPod connected";
    body.innerHTML = `<div class="lcd-line1">${l1}</div><div class="lcd-line2">${S.devices.length ? "" : "Connect it with its USB cable"}</div>`;
    return;
  }
  body.innerHTML = `<div class="lcd-line1">${esc(plural(lib.tracks.length, "song"))}</div>
    <div class="lcd-line2">${esc(fmtBytes(lib.device.free))} free of ${esc(fmtBytes(lib.device.total))}</div>`;
}
let flashTimer;

/* ------------------------------------------------------------------ battery */
// The iPod reports its battery over its USB accessory interface. The icon
// shows the level; hovering it (or focusing it) shows the details.
let battReq = null, battRoot = null;
function refreshBattery(){
  const root = S.lib ? S.lib.device.root : "";
  if (!root){ S.batt = null; paintBattery(); return Promise.resolve(); }
  if (battReq) return battReq;
  battReq = api("battery", root)
    .then(v => { if (S.lib && S.lib.device.root === root) S.batt = v; })
    .catch(e => { S.batt = {available:false, percent:-1, reason:e.message}; })
    .finally(() => { battReq = null; paintBattery(); });
  return battReq;
}
function battLevel(){
  const b = S.batt;
  return b && b.available && b.percent >= 0 ? b.percent : null;
}
function battInfo(){
  const b = S.batt;
  if (!S.lib) return {big:"No iPod", state:"Connect an iPod to see its battery.", unknown:true};
  if (!b) return {big:"Checking…", state:"Asking the iPod for its battery level.", unknown:true};
  if (!b.available) return {big:"Unavailable", state:b.reason || "The iPod didn’t report its battery.", unknown:true,
    note:"The battery is read over the iPod’s USB accessory connection, the one car stereos use."};
  const pct = b.percent >= 0 ? b.percent + "%" : b.charged ? "Full" : b.charging ? "Charging" : "—";
  let state;
  if (b.charging) state = b.percent >= 0 ? "<b>Charging</b>" : "The iPod doesn’t report its level while charging.";
  else if (b.charged) state = "<b>Fully charged</b>";
  else if (b.external) state = esc(b.state || "Plugged in, not charging");
  else state = esc(b.state || "On battery");
  if (b.state && /low/i.test(b.state) && !b.charging) state = "<b>Battery low</b>";
  return {big:pct, state, html:true, charging:b.charging, unknown:b.percent < 0 && !b.charged,
    note:b.checked ? "Checked " + new Date(b.checked).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : ""};
}
function paintBattery(){
  const box = $("#battBox"); if (!box) return;
  const lvl = battLevel(), b = S.batt, info = battInfo();
  const charged = !!(b && b.available && b.charged);
  box.classList.toggle("unknown", lvl === null && !charged);
  box.classList.toggle("charging", !!(b && b.available && b.charging));
  box.classList.toggle("low", lvl !== null && lvl < 20 && !(b && b.charging));
  $("#lcdBatt").style.width = (charged && lvl === null ? 100 : Math.max(6, lvl ?? 100)) + "%";
  const plain = (info.big + ". " + String(info.state).replace(/<[^>]+>/g, "")).replace(/…\./, "…");
  box.setAttribute("aria-label", "Battery: " + plain);
  const sb = $("#sumBatt"); if (sb) sb.textContent = battShort();
  const pop = $("#battPop"); if (pop) fillBattPop(pop, info);
}
function battShort(){
  const b = S.batt;
  if (!b) return "…";
  if (!b.available) return "—";
  return (b.percent >= 0 ? b.percent + "%" : b.charged ? "Full" : "—") + (b.charging ? " ⚡" : "");
}
function fillBattPop(pop, info){
  const lvl = battLevel(), b = S.batt;
  const w = lvl ?? (b && b.available && b.charged ? 100 : 0);
  const low = lvl !== null && lvl < 20 && !(b && b.charging);
  pop.innerHTML = `<div class="bp-row"><div class="bp-big ${info.unknown ? "unknown" : ""} ${low ? "low" : ""}" aria-hidden="true"><i style="width:${w}%"></i>${info.charging ? `<svg><use href="#i-bolt"/></svg>` : ""}</div>
    <div style="min-width:0"><div class="bp-pct">${esc(info.big)}</div><div class="bp-state">${info.html ? info.state : esc(info.state)}</div></div></div>
    ${info.note ? `<div class="bp-note">${esc(info.note)}</div>` : ""}`;
}
function showBattPop(){
  const box = $("#battBox");
  let pop = $("#battPop");
  if (!pop){ pop = document.createElement("div"); pop.id = "battPop"; pop.className = "battpop"; pop.setAttribute("role", "tooltip"); document.body.appendChild(pop); }
  fillBattPop(pop, battInfo());
  const z = cssZoom || 1, r = box.getBoundingClientRect();

function baseTracks(){
  if (!S.lib) return [];
  if (S.view.startsWith("pl:")){
    const p = S.lib.playlists[+S.view.slice(3)];

  }

}
function searchFilter(list){
  const words = S.search.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return list;
  return list.filter(t => { const hay = `${t.title} ${t.artist||""} ${t.album||""} ${t.albumArtist||""} ${t.genre||""} ${t.composer||""}`.toLowerCase();
    return words.every(w => hay.includes(w)); });
}
function cmpBy(key){
  const s = (a, b) => { const x = sortKey(a), y = sortKey(b); return x < y ? -1 : x > y ? 1 : 0; };
  const albumOrder = (a, b) => s(a.album, b.album) || (a.discNumber||0) - (b.discNumber||0) || (a.trackNumber||0) - (b.trackNumber||0) || s(a.title, b.title);
  switch (key){
    case "artist": return (a, b) => s(a.albumArtist || a.artist, b.albumArtist || b.artist) || albumOrder(a, b);
    case "album": return albumOrder;
    case "genre": return (a, b) => s(a.genre, b.genre) || s(a.artist, b.artist) || albumOrder(a, b);
    case "title": return (a, b) => s(a.title, b.title) || s(a.artist, b.artist);
    case "type": return (a, b) => s(fileType(a), fileType(b)) || s(a.artist, b.artist) || albumOrder(a, b);
    default: return (a, b) => ((a[key]||0) - (b[key]||0)) || s(a.artist, b.artist) || albumOrder(a, b);
  }
}
function buildList(){
  if (!S.listDirty) return S.list;
  let list = searchFilter(baseTracks());
  if (S.browser && S.view !== "summary"){
    const {genre, artist, album} = S.bsel;
    if (genre !== null) list = list.filter(t => (t.genre||"") === genre);
    if (artist !== null) list = list.filter(t => (t.albumArtist || t.artist || "") === artist);
    if (album !== null) list = list.filter(t => (t.album||"") === album);
  }
  const isPl = S.view.startsWith("pl:");
  if (!(isPl && S.sort.key === "playlist")){
    const c = cmpBy(S.sort.key);
    list = list.slice().sort((a, b) => c(a, b) * S.sort.dir);
  }
  S.list = list; S.listDirty = false;
  return list;
}

    if (e.button === 2 && S.sel.has(id)) return;
    if (e.shiftKey && S.anchor !== null){ if (!e.ctrlKey) S.sel.clear(); selectRange(indexOfId(S.anchor), i); }
    else if (e.ctrlKey){ S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); S.anchor = id; }
    else if (S.sel.has(id) && S.sel.size > 1){ pendingCollapse = id; } // may be the start of a drag
    else { S.sel.clear(); S.sel.add(id); S.anchor = id; }
    if (e.button === 0 && S.sel.has(id) && !e.target.closest("[data-star]")) dragStart = {x: e.clientX, y: e.clientY};
    S.cursor = id; renderRows(true); updateButtons();
  });
  sc.addEventListener("click", e => {
    const st = e.target.closest("[data-star]");
    if (st && S.lib && !S.lib.readOnly && !S.busy){
      const id = +st.dataset.id, t = S.byId.get(id), r = +st.dataset.star * 20;
      setRating([id], t.rating === r ? 0 : r);
    }
  });
  sc.addEventListener("dblclick", e => { if (e.target.closest(".row") && !e.target.closest("[data-star]")) openInfo(); });
  sc.addEventListener("contextmenu", e => {
    e.preventDefault();
    const row = e.target.closest(".row"); if (!row) return;
    showCtx(e.clientX, e.clientY);
  });
  sc.addEventListener("keydown", e => {
    const list = S.list; if (!list.length) return;
    let ci = S.cursor != null ? indexOfId(S.cursor) : -1;
    const page = Math.max(1, Math.floor(sc.clientHeight / ROW) - 1);
    let ni = null;
    if (e.key === "ArrowDown") ni = Math.min(list.length-1, ci+1);
    else if (e.key === "ArrowUp") ni = Math.max(0, ci < 0 ? 0 : ci-1);
    else if (e.key === "PageDown") ni = Math.min(list.length-1, ci+page);
    else if (e.key === "PageUp") ni = Math.max(0, ci-page);
    else if (e.key === "Home") ni = 0;
    else if (e.key === "End") ni = list.length-1;
    else if (e.key === "Enter"){ e.preventDefault(); openInfo(); return; }
    else if ((e.key === "Delete" || e.key === "Backspace") && S.sel.size){ e.preventDefault(); confirmRemove(); return; }
    else if (e.ctrlKey && (e.key === "a" || e.key === "A")){ e.preventDefault(); list.forEach(t => S.sel.add(t.id)); renderRows(true); updateButtons(); return; }
    if (ni === null) return;
    e.preventDefault();
    const id = list[ni].id;
    if (e.shiftKey){ if (S.anchor === null) S.anchor = id; S.sel.clear(); selectRange(indexOfId(S.anchor), ni); }
    else { S.sel.clear(); S.sel.add(id); S.anchor = id; }
    S.cursor = id; scrollToIndex(ni); renderRows(true); updateButtons();
  });
}

/* ------------------------------------------------------------------ drag songs out to Explorer */
let dragStart = null, pendingCollapse = null;
addEventListener("mousemove", e => {
  if (!dragStart) return;

  if (Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) < 6) return;
  dragStart = null; pendingCollapse = null;
  startDragOut();
});
addEventListener("mouseup", () => {
  dragStart = null;
  if (pendingCollapse !== null){ const id = pendingCollapse; pendingCollapse = null; S.sel.clear(); S.sel.add(id); S.anchor = id; renderRows(true); updateButtons(); }
});
async function startDragOut(){
  if (!S.lib || !S.sel.size || S.dragOut) return;

  const ids = S.list.filter(t => S.sel.has(t.id)).map(t => t.id);

/* ------------------------------------------------------------------ drag songs in from Explorer */
const BAD_TYPES = /^(audio\/(flac|x-flac|ogg|opus|x-ms-wma|ape|x-ape)|video\/|image\/|text\/|application\/(pdf|zip|x-zip))/;
let dragDepth = 0;
function dropDenyReason(){
  if (!S.lib) return S.devices.length ? "Open your iPod first" : "Connect your iPod first";
  if (S.lib.readOnly) return "This iPod is read-only";
  if (S.busy) return "Please wait for the current task to finish";
  return "";
}
function showDropZone(e){
  const z = $("#dropzone");
  const items = [...(e.dataTransfer.items || [])].filter(i => i.kind === "file");
  const bad = items.filter(i => BAD_TYPES.test(i.type || ""));
  const reason = dropDenyReason();
  const allBad = items.length > 0 && bad.length === items.length;
  z.classList.add("on");
  z.classList.toggle("deny", !!reason || allBad);
  const kinds = [...new Set(bad.map(i => (i.type.split("/")[1] || "").replace(/^x-/, "").toUpperCase()))].join(", ");
  $("#dropTitle").textContent = reason || (allBad ? "Can’t copy these files" : `Copy to ${S.lib.device.name}`);
  $("#dropSub").textContent = reason ? "" : allBad ? `${kinds || "These files"} can’t be played on an iPod` : (items.length ? `Drop to copy ${plural(items.length, "item")}` + (bad.length ? ` (${bad.length} can’t be played on an iPod)` : "") : "Drop songs or folders");
  e.dataTransfer.dropEffect = (reason || allBad) ? "none" : "copy";
}
function hideDropZone(){ dragDepth = 0; $("#dropzone").classList.remove("on"); }
function isFileDrag(e){ return !S.dragOut && [...(e.dataTransfer?.types || [])].includes("Files"); }
addEventListener("dragenter", e => { if (!isFileDrag(e)) return; e.preventDefault(); dragDepth++; showDropZone(e); });
addEventListener("dragover", e => { e.preventDefault(); if (!isFileDrag(e)){ e.dataTransfer.dropEffect = "none"; return; } showDropZone(e); });
addEventListener("dragleave", e => { if (!isFileDrag(e)) return; dragDepth = Math.max(0, dragDepth-1); if (!dragDepth || !e.relatedTarget) hideDropZone(); });
addEventListener("drop", e => {
  e.preventDefault();
  const wasFiles = isFileDrag(e);
  hideDropZone();
  if (!wasFiles) return;
  const reason = dropDenyReason();
  if (reason){ alertSheet("Can’t copy to the iPod", reason + "."); return; }
  const files = e.dataTransfer.files;
  if (!files || !files.length) return;
  const wv = window.chrome && chrome.webview;
  if (wv && wv.postMessageWithAdditionalObjects){
    flash("Checking songs…", "");
    wv.postMessageWithAdditionalObjects("podmanager-drop", files);
  } else if (window.__podPlatform === "dev"){
    flash("Checking songs…", "");
    api("dropNames", [...files].map(f => f.name)).catch(err => alertSheet("Couldn’t add the songs", err.message));
  } else {
    alertSheet("Drag and drop isn’t available", "Your copy of the Microsoft Edge WebView2 Runtime is too old to pass dropped files to PodManager. Update it from Windows Update, or use Add Songs.");
  }
});
function rejectList(list){
  return `<div class="errlist">${list.map(x => `<div><b title="${esc(x.item)}">${esc(x.item.split(/[\\/]/).pop())}</b><span>${esc(x.message)}</span></div>`).join("")}</div>`;
}
function handleDropCheck(d){
  S.flash = null; renderLCD();

  if (!ok.length){

      <div class="sheet-b"><p>The iPod classic plays MP3, AAC (M4A), Apple Lossless, WAV and AIFF files. Convert other formats before adding them.</p>${rejectList(rej)}</div>

    (v, close) => { v.querySelector("[data-c]").onclick = close; v.querySelector("[data-ok]").onclick = () => { close(); go(); }; });

/* ------------------------------------------------------------------ sheets */
let sheetStack = [];
function sheet(html, onReady){
  closeCtx();
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(v);
  const onKey = e => {
    if (e.key === "Escape" && sheetStack[sheetStack.length-1] === close && !document.querySelector(".lightbox")){ e.preventDefault(); close(); }
  };
  const close = () => { v.remove(); removeEventListener("keydown", onKey, true); sheetStack = sheetStack.filter(x => x !== close); const sc = $("#tscroll"); sc && sc.focus(); };
  sheetStack.push(close);

  v.addEventListener("keydown", e => e.stopPropagation());
  onReady && onReady(v, close);

}

/* ------------------------------------------------------------------ Get Info */
const FIELDS = [

  ["grouping","Grouping","text"],["composer","Composer","text"],["comment","Comments","area"],["genre","Genre","genre"],
  ["year","Year","num"],["track","Track","pair"],["disc","Disc","pair"],["bpm","BPM","num"],["rating","Rating","rating"],["compilation","Compilation","bool"],

function openInfo(){
  if (!canWrite() || !S.sel.size) return;
  const ids = S.list.filter(t => S.sel.has(t.id)).map(t => t.id);
  if (ids.length === 1) infoSheet(ids[0], null); else infoSheet(null, ids);
}
function infoSheet(singleId, multiIds){
  const multi = !!multiIds;
  const tracks = multi ? multiIds.map(id => S.byId.get(id)) : [S.byId.get(singleId)];
  const common = k => { const v = tracks[0][k]; return tracks.every(t => (t[k] ?? "") === (v ?? "")) ? (v ?? "") : undefined; };
  const genres = [...new Set(S.lib.tracks.map(t => t.genre).filter(Boolean))].sort();
  const val = k => { const v = common(k); return v === undefined ? "" : v; };
  const mixed = k => common(k) === undefined;
  const pick = k => multi ? `<input type="checkbox" class="pick" data-pick="${k}" aria-label="Change ${k}">` : "";
  const ro = (k, label) => `<label class="k" for="f_${k}">${label}</label>`;
  let rows = "";
  for (const [k, label, type] of FIELDS){
    if (type === "text") rows += ro(k, label) + `<div class="f">${pick(k)}<input type="text" id="f_${k}" data-f="${k}" value="${esc(val(k))}" class="${mixed(k) ? "mixed" : ""}" placeholder="${mixed(k) ? "Mixed" : ""}"></div>`;
    if (type === "area") rows += ro(k, label) + `<div class="f">${pick(k)}<textarea id="f_${k}" data-f="${k}" class="${mixed(k) ? "mixed" : ""}" placeholder="${mixed(k) ? "Mixed" : ""}">${esc(val(k))}</textarea></div>`;
    if (type === "genre") rows += ro(k, label) + `<div class="f">${pick(k)}<input type="text" id="f_${k}" data-f="${k}" list="genreList" value="${esc(val(k))}" class="${mixed(k) ? "mixed" : ""}" placeholder="${mixed(k) ? "Mixed" : ""}"><datalist id="genreList">${genres.map(g => `<option value="${esc(g)}">`).join("")}</datalist></div>`;
    if (type === "num") rows += ro(k, label) + `<div class="f">${pick(k)}<input type="number" min="0" max="65535" class="short ${mixed(k) ? "mixed" : ""}" id="f_${k}" data-f="${k}" value="${val(k) || ""}" placeholder="${mixed(k) ? "–" : ""}"></div>`;
    if (type === "pair"){
      const a = k === "track" ? "trackNumber" : "discNumber", b = k === "track" ? "trackCount" : "discCount";
      rows += ro(a, label) + `<div class="f">${pick(a)}<input type="number" min="0" max="999" class="short" id="f_${a}" data-f="${a}" value="${val(a) || ""}" placeholder="${mixed(a) ? "–" : ""}"><span class="of">of</span>${pick(b)}<input type="number" min="0" max="999" class="short" data-f="${b}" value="${val(b) || ""}" placeholder="${mixed(b) ? "–" : ""}" aria-label="${label} count"></div>`;
    }

  }
  const t0 = tracks[0];
  const meta = "";
  const writeDef = store.get("writeTags", true);
  const listIdx = multi ? -1 : indexOfId(singleId);
  const cArtist = common("artist"), cAlbum = common("album");
  const head = multi
    ? [`${tracks.length.toLocaleString()} songs`, cArtist === undefined ? "Multiple artists" : (cArtist || "Unknown artist"), cAlbum === undefined ? "Multiple albums" : (cAlbum || "Unknown album"), fmtTime(tracks.reduce((s, t) => s + (t.lengthMs||0), 0))]
    : [t0.title, t0.artist || "Unknown artist", t0.album || "Unknown album",
       `${t0.kind || ""} · ${fmtTime(t0.lengthMs)} · ${t0.bitrate || "?"} kbps · ${((t0.sampleRate||0)/1000).toFixed(1)} kHz · ${fmtBytes(t0.size)}`];
  const playLine = multi ? "" : (t0.plays ? `Played ${plural(t0.plays, "time")}${t0.lastPlayed ? ", last on " + new Date(t0.lastPlayed*1000).toLocaleDateString() : ""}` : "Not played yet");
  const sameAlbum = !multi || (cAlbum !== undefined && cAlbum !== "");
  sheet(`<div class="info-head"><div class="art ${multi && !sameAlbum ? "stack" : ""}" id="infoArt" aria-label="Album artwork"><svg><use href="#i-note"/></svg></div>
      <div class="info-titles"><div class="it1" title="${esc(head[0])}">${esc(head[0])}</div><div class="it2">${esc(head[1])}</div><div class="it3">${esc(head[2])}</div><div class="it4" id="artCap">${esc(head[3])}</div>${playLine ? `<div class="it4 it5" title="${esc((t0.path||"").replace(/\//g, "\\"))}">${esc(playLine)}</div>` : ""}</div></div>
    <div class="sheet-b">
      ${multi ? `<p style="color:var(--muted);font-size:12px">Only the ticked fields change. Editing a field ticks it.</p>` : ""}
      <form class="form" id="infoForm" autocomplete="off">${rows}</form>${meta}</div>
    <div class="sheet-f"><div class="left">
      ${multi ? "" : `<button class="btn" data-prev ${listIdx <= 0 ? "disabled" : ""}>Previous</button><button class="btn" data-next ${listIdx < 0 || listIdx >= S.list.length-1 ? "disabled" : ""}>Next</button>`}
      <label class="check" title="Also write the changes into the song files' tags (ID3 / MP4)"><input type="checkbox" data-write ${writeDef ? "checked" : ""}>Update song files</label></div>
      <button class="btn" data-c>Cancel</button><button class="btn primary" data-ok>OK</button></div>`,
  (v, close) => {

    const rEl = v.querySelector(".rating-edit");
    let rating = +rEl.dataset.r;
    const paintStars = () => rEl.querySelectorAll("[data-s]").forEach(s => s.classList.toggle("on", +s.dataset.s > 0 && +s.dataset.s <= Math.round(rating/20)));
    paintStars();
    const markPick = k => { touched.add(k); const cb = v.querySelector(`[data-pick="${k}"]`); if (cb) cb.checked = true; };
    rEl.onclick = e => { const s = e.target.closest("[data-s]"); if (!s) return; rating = +s.dataset.s * 20; paintStars(); markPick("rating"); };
    form.addEventListener("input", e => { const k = e.target.dataset.f; if (k){ markPick(k); e.target.classList.remove("mixed"); } });
    form.addEventListener("change", e => { const k = e.target.dataset.f; if (k) markPick(k); });
    form.addEventListener("submit", e => { e.preventDefault(); save(true); });
    v.querySelectorAll("[data-pick]").forEach(cb => cb.addEventListener("change", () => { cb.checked ? touched.add(cb.dataset.pick) : touched.delete(cb.dataset.pick); }));
    const buildPatch = () => {
      const p = {};
      const include = k => multi ? !!(v.querySelector(`[data-pick="${k}"]`) || {}).checked : touched.has(k);
      v.querySelectorAll("[data-f]").forEach(el => {
        const k = el.dataset.f; if (!include(k)) return;

        else p[k] = el.value;
      });
      if (include("rating") && rating >= 0) p.rating = rating;
      return p;
    };
    const save = async (andClose, after) => {
      const p = buildPatch(), write = v.querySelector("[data-write]").checked;
      store.set("writeTags", write);
      if (andClose) close();
      if (!Object.keys(p).length){ after && after(); return; }
      try { await api("update", multi ? multiIds : [singleId], p, write); pendingAfterJob = after || null; }
      catch(e){ alertSheet("Couldn’t save the changes", e.message); }
    };
    v.querySelector("[data-ok]").onclick = () => save(true);
    v.querySelector("[data-c]").onclick = close;
    v.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName !== "TEXTAREA"){ e.preventDefault(); save(true); } });
    const nav = d => {
      const ni = listIdx + d; const t = S.list[ni]; if (!t) return;
      S.sel.clear(); S.sel.add(t.id); S.anchor = S.cursor = t.id; scrollToIndex(ni); renderRows(true);

  });
}
let pendingAfterJob = null;
async function loadArt(v, id, cap, multi){

  if (id === null){ note("Multiple albums"); return; }
  let art = null;

  if (!box.isConnected) return;
  if (!art){ note("No artwork"); return; }
  const img = new Image();
  img.alt = "Album artwork"; img.src = art.dataUrl;
  img.title = `${art.width} × ${art.height}` + (art.source === "ipod" ? " · stored on the iPod" : " · embedded in the song file") + " · click to enlarge";
  img.onclick = () => {
    const lb = document.createElement("div"); lb.className = "lightbox";
    lb.innerHTML = `<div><img src="${art.dataUrl}" alt="Album artwork"><p>${art.width} × ${art.height}${art.source === "ipod" ? " · stored on the iPod" : ""}</p></div>`;
    const shut = e => { e && e.stopPropagation(); lb.remove(); removeEventListener("keydown", key, true); };
    const key = e => { if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); shut(); } };
    lb.onclick = shut; addEventListener("keydown", key, true);
    document.body.appendChild(lb);
  };
  box.querySelector("svg").remove();
  box.appendChild(img);
}

/* ------------------------------------------------------------------ jobs / events */
function jobSummary(r){
  const n = r.ok;
  switch (r.job){
    case "add": return [n ? `Added ${plural(n, "song")}` : "No songs added", r.skipped ? `${r.skipped} already on the iPod` : ""];
    case "remove": return [`Removed ${plural(n, "song")}`, ""];
    case "update": return [n === 1 ? "Song updated" : `Updated ${plural(n, "song")}`, ""];
    case "export": return [`Copied ${plural(n, "song")}`, "to your computer"];
  }
  return ["Done", ""];
}
async function onEvent(e){
  if (e.type === "progress"){ S.busy = {job:e.job, done:e.done||0, total:e.total||0, label:e.label}; renderLCD(); updateButtons(); return; }
  if (e.type === "done"){
    S.busy = null;
    const r = e.result;
    if (r.job !== "export") await reload();
    updateButtons();
    if (r.error) alertSheet("Something went wrong", r.error + (r.ok ? ` (${plural(r.ok, "song")} finished before this happened.)` : ""));
    const [a, b] = jobSummary(r);
    flash(r.cancelled ? a + " (stopped)" : a, b);
    const issues = r.errors || [], notes = (r.notes || []).filter(x => !/already on the iPod/.test(x));
    if (issues.length || (notes.length && r.job !== "add") || (notes.length && !r.ok)){
      sheet(`<div class="sheet-h">${issues.length ? (issues.length === 1 ? "1 song had a problem" : `${issues.length} songs had problems`) : a}</div><div class="sheet-b">
        ${notes.map(n => `<p>${esc(n)}</p>`).join("")}
        ${issues.length ? `<div class="errlist">${issues.map(x => `<div><b title="${esc(x.item)}">${esc(x.item.split(/[\\/]/).pop())}</b><span>${esc(x.message)}</span></div>`).join("")}</div>` : ""}
        </div><div class="sheet-f"><button class="btn primary" data-ok>OK</button></div>`, (v, close) => { v.querySelector("[data-ok]").onclick = close; });
    }
    if (pendingAfterJob){ const f = pendingAfterJob; pendingAfterJob = null; f(); }
    return;
  }
  if (e.type === "drop"){ handleDropCheck(e.drop || {}); return; }
  if (e.type === "devices"){ S.devices = e.devices || []; if (!S.lib && S.devices.length === 1 && S.view !== "setup") openDevice(S.devices[0].root); renderAll(); return; }
  if (e.type === "deviceGone"){ setLib(null); S.view = "music"; renderAll(); flash("iPod disconnected", ""); }
}
window.__podEvent = e => { onEvent(e).catch(err => console.error(err)); };

/* ------------------------------------------------------------------ loading */
function setLib(lib){
  if (lib){ lib.tracks = lib.tracks || []; lib.playlists = lib.playlists || []; }
  S.lib = lib; S.byId = new Map(); S.listDirty = true;
  if (lib) for (const t of lib.tracks) S.byId.set(t.id, t);
  for (const id of [...S.sel]) if (!S.byId.has(id)) S.sel.delete(id);
  const root = lib ? lib.device.root : null;
  if (root !== battRoot){ battRoot = root; S.batt = null; if (root) refreshBattery(); else hideBattPop(); }
  applyTheme();
}
async function reload(){
  try { setLib(await api("library")); } catch(e){ setLib(null); }
  if (S.view.startsWith("pl:") && !(S.lib && S.lib.playlists[+S.view.slice(3)])) S.view = "music";
  renderAll();
}
async function openDevice(root){
  try {
    flash("Opening iPod…", "");
    setLib(await api("open", root));
    S.view = "music"; S.sel.clear(); S.flash = null;
  } catch(e){
    if (String(e.message).startsWith("NO_DATABASE")){ setLib(null); S.setupRoot = root; S.view = "setup"; S.flash = null; }
    else alertSheet("Couldn’t open the iPod", e.message);
  }
  renderAll();
}
function renderStats(){
  const st = $("#stats"), mc = $("#miniCap");
  if (!S.lib){ st.textContent = ""; mc.innerHTML = ""; return; }
  if (S.view === "summary"){ st.textContent = ""; }
  else {
    const list = S.listDirty ? buildList() : S.list;
    const ms = list.reduce((s, t) => s + (t.lengthMs||0), 0), b = list.reduce((s, t) => s + (t.size||0), 0);
    const selN = S.sel.size;
    st.textContent = `${plural(list.length, "song")}, ${fmtTotal(ms)}, ${fmtBytes(b)}` + (selN > 1 ? ` — ${selN.toLocaleString()} selected` : "");
  }
  const c = capParts(S.lib.device, S.lib.musicBytes);
  const pctFree = c.total ? Math.round(c.free / c.total * 100) : 0;
  const tip = `${fmtBytes(c.free)} free of ${fmtBytes(c.total)} (${pctFree}% free) · Audio ${fmtBytes(c.audio)} · Other ${fmtBytes(c.other)}`;
  mc.title = tip;
  mc.innerHTML = `<div class="minibar" role="img" aria-label="${esc(tip)}"><i class="a" style="width:${c.pa}%"></i><i class="o" style="width:${c.po}%"></i></div>
    <span class="captext"><b>${esc(fmtBytes(c.free))}</b> free of ${esc(fmtBytes(c.total))}</span>`;
}
function renderAll(){ applyTheme(); renderSidebar(); renderMain(); renderLCD(); renderStats(); updateButtons(); }

/* ------------------------------------------------------------------ toolbar & keys */
$("#bOptions").onclick = openOptions;
$("#bAdd").onclick = addSongs; $("#bFolder").onclick = addFolder; $("#bInfo").onclick = openInfo; $("#bRemove").onclick = confirmRemove;
$("#bBrowse").onclick = () => { S.browser = !S.browser; store.set("browser", S.browser); S.bsel = {genre:null, artist:null, album:null}; S.listDirty = true; if (S.view === "summary") S.view = "music"; renderAll(); };
let searchT;
$("#search").addEventListener("input", e => {
  clearTimeout(searchT);
  $("#searchBox").classList.toggle("has", !!e.target.value);
  searchT = setTimeout(() => { S.search = e.target.value.trim(); S.listDirty = true; S.bsel = {genre:null, artist:null, album:null};
    if (S.view === "summary") { S.view = "music"; renderAll(); } else { if (S.browser) renderBrowser(); const sc = $("#tscroll"); if (sc) sc.scrollTop = 0; renderRows(true); } }, 140);
});
$("#search").addEventListener("keydown", e => { if (e.key === "Escape"){ $("#search").value = ""; $("#search").dispatchEvent(new Event("input")); } if (e.key === "ArrowDown"){ const sc = $("#tscroll"); sc && sc.focus(); } });
$("#searchClear").onclick = e => { e.preventDefault(); $("#search").value = ""; $("#search").dispatchEvent(new Event("input")); $("#search").focus(); };
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  // block browser reload / navigation shortcuts, which would blank the app
  if (k === "f5" || (e.ctrlKey && ["r","p","n","t","w","u","g","j","h","l"].includes(k)) || (e.altKey && (k === "arrowleft" || k === "arrowright")) || k === "browserback"){ e.preventDefault(); return; }
  if (e.ctrlKey && (k === "=" || k === "+" || e.code === "NumpadAdd")){ e.preventDefault(); stepScale(1); return; }
  if (e.ctrlKey && (k === "-" || e.code === "NumpadSubtract")){ e.preventDefault(); stepScale(-1); return; }
  if (e.ctrlKey && (k === "0" || e.code === "Numpad0")){ e.preventDefault(); stepScale(0); return; }
  if (sheetStack.length) return;
  if (e.ctrlKey && k === ","){ e.preventDefault(); openOptions(); }
  if (e.ctrlKey && k === "f"){ e.preventDefault(); $("#search").focus(); $("#search").select(); }
  if (e.ctrlKey && k === "o"){ e.preventDefault(); addSongs(); }
  if (e.ctrlKey && k === "i"){ e.preventDefault(); openInfo(); }
  if (e.ctrlKey && k === "b"){ e.preventDefault(); $("#bBrowse").click(); }
});
addEventListener("contextmenu", e => { if (!e.target.closest("input,textarea")) e.preventDefault(); });
addEventListener("resize", () => renderRows(true));
let wheelAcc = 0;
addEventListener("wheel", e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) >= 100){ stepScale(wheelAcc < 0 ? 1 : -1); wheelAcc = 0; }
}, {passive:false});

/* ------------------------------------------------------------------ start */
async function start(){
  try { Object.assign(prefs, await api("prefs") || {}); } catch(e){}
  S.sort = store.get("sort", S.sort); S.browser = store.get("browser", false);
  const cw = store.get("colWidths", {}); S.widths = cw && typeof cw === "object" && !Array.isArray(cw) ? cw : {};
  S.hidden = new Set(store.get("hiddenCols", [])); S.theme = store.get("theme", "auto");
  applyTextSize(+store.get("textSize", 1) || 1, false);
  const sc = +store.get("scale", 1) || 1;
  if (sc !== 1) applyScale(sc, true); else S.scale = 1;
  renderAll();
  try {
    S.devices = await api("devices");
    if (S.devices.length === 1) await openDevice(S.devices[0].root);
    else renderAll();
  } catch(e){ renderAll(); flash("Backend not available", e.message); }
}
start();
})();
</script>
